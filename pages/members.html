<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>団員一覧 — 東大阪吹奏楽団</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .search-bar { display:flex; gap:var(--space-3); flex-wrap:wrap; }
    .search-bar input { flex:2 1 200px; }
    .search-bar select { flex:1 1 140px; min-width:140px; }
    @media(max-width:640px) {
      .search-bar { gap:var(--space-2); }
      .search-bar input { flex-basis:100%; }
      .search-bar select { min-width:0; flex-basis:calc(33.333% - var(--space-2)); }
    }

    /* ── メンバーリスト ── */
    .member-list { display:flex; flex-direction:column; gap:0; }
    .member-row {
      background:var(--white);
      border-bottom:1px solid var(--gray-200);
      padding:var(--space-4) var(--space-5);
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:var(--space-3);
      transition:background var(--transition-fast);
    }
    .member-row:first-child { border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
    .member-row:last-child  { border-bottom:none; border-radius:0 0 var(--radius-lg) var(--radius-lg); }
    .member-row:only-child  { border-radius:var(--radius-lg); }
    .member-row:hover { background:var(--gray-100); }

    /* 行1：名前・フリガナ */
    .member-row__line1 {
      display:flex; align-items:baseline; gap:var(--space-3);
      margin-bottom:var(--space-1); flex-wrap:wrap;
    }
    .member-row__name {
      font-weight:700; color:var(--navy-800);
      font-size:var(--text-base);
    }
    .member-row__kana {
      font-size:var(--text-xs); color:var(--gray-400);
    }
    .member-row__cat {
      font-size:11px; color:var(--gray-500); white-space:nowrap;
    }

    /* 行2：メタ情報 */
    .member-row__line2 {
      display:flex; align-items:center; gap:var(--space-3);
      flex-wrap:wrap;
    }
    .member-row__part {
      font-size:var(--text-sm); color:var(--gray-600);
      display:flex; align-items:center; gap:var(--space-1);
    }
    .member-row__part::before {
      content:'';
      display:inline-block;
      width:6px; height:6px;
      border-radius:50%;
      background:var(--gold-500);
      flex-shrink:0;
    }
    .member-row__joined {
      font-size:var(--text-xs); color:var(--gray-400);
    }
    .member-row__badges {
      display:flex; gap:var(--space-1); flex-wrap:wrap; align-items:center;
    }

    /* 詳細ボタン列 */
    .member-row__action { flex-shrink:0; }

    /* モーダル詳細 */
    .detail-dl {
      display:grid; grid-template-columns:100px 1fr;
      gap:var(--space-2) var(--space-4);
      font-size:var(--text-sm);
    }
    .detail-dl dt { color:var(--gray-500); }
    .detail-dl dd { color:var(--gray-800); font-weight:500; word-break:break-all; }

    /* スマホ対応 */
    @media(max-width:640px) {
      .member-row {
        padding:var(--space-3) var(--space-4);
        grid-template-columns:1fr auto;
        gap:var(--space-2);
      }
      .member-row__line2 { gap:var(--space-2); }
      .detail-dl { grid-template-columns:88px 1fr; }
    }
  </style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="page-header fade-in">
      <div>
        <p class="page-header__eyebrow">MEMBERS</p>
        <h1 class="page-header__title">団員一覧</h1>
      </div>
      <div class="page-header__actions">
        <span id="member-count" style="font-size:var(--text-sm);color:var(--gray-500);"></span>
      </div>
    </div>

    <!-- 検索・フィルター -->
    <div class="card fade-in fade-in-1 mb-6">
      <div class="card__body">
        <div class="search-bar">
          <input type="text" id="search-input" class="form-control" placeholder="氏名・フリガナで検索…">
          <!-- 選択肢は共通定義（config.js の区分・common.js の役職・下の PART_GROUPS）から作る -->
          <select id="filter-part" class="form-control" aria-label="楽器で絞り込み">
            <option value="">全楽器</option>
          </select>
          <select id="filter-category" class="form-control" aria-label="区分で絞り込み">
            <option value="">全区分</option>
          </select>
          <select id="filter-role" class="form-control" aria-label="役職で絞り込み">
            <option value="">全役職</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 団員リスト -->
    <div class="card fade-in fade-in-2" style="overflow:hidden;">
      <div class="member-list" id="member-list">
        <div style="text-align:center;padding:var(--space-16);color:var(--gray-500);">
          <div class="loading-spinner" style="margin:0 auto var(--space-4);"></div>
          <p>読み込み中…</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ── 詳細モーダル（GM・管理者のみ） ── -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal" style="max-width:560px;">
    <div class="modal__header">
      <h2 class="modal__title" id="detail-modal-title">団員詳細</h2>
      <button class="modal__close" onclick="closeModal('modal-detail')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal__body" id="detail-modal-body"></div>
    <div class="modal__footer">
      <button class="btn btn-outline" onclick="closeModal('modal-detail')">閉じる</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="../js/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script>
const PART_LABELS = {
  piccolo:'Piccolo',flute:'Flute', oboe:'Oboe', clarinet:'Clarinet', bassclarinet:'BassClarinet', bassoon:'Bassoon',
  ssaxophone:'S.Sax', asaxophone:'A.Sax', tsaxophone:'T.Sax', bsaxophone:'B.Sax', horn:'Horn', trumpet:'Trumpet', trombone:'Trombone',
  euphonium:'Euphonium', tuba:'Tuba', percussion:'Percussion', contrabass:'Contrabass',
  piano:'Piano', staff:'Staff', other:'Other',
};
// 楽器プルダウンの並び（設定画面・初回登録のパート選択と同じ順）
const PART_GROUPS = [
  { label:'木管楽器', parts:['piccolo','flute','oboe','clarinet','bassclarinet','bassoon','ssaxophone','asaxophone','tsaxophone','bsaxophone'] },
  { label:'金管楽器', parts:['trumpet','horn','trombone','euphonium','tuba'] },
  { label:'打楽器・その他', parts:['percussion','contrabass','piano'] },
  { label:'その他', parts:['staff','other'] },
];
const CATEGORY_BADGE  = { regular:'badge-success', trainee:'badge-navy', rest:'badge-warning', support:'badge-gold' };

// 詳細モーダルの閲覧権限ロール
const DETAIL_ROLES = ['gm', 'leader','subleader'];

const DEMO_MEMBERS = [
  { id:'1', last_name:'山田', first_name:'太郎', last_kana:'ヤマダ', first_kana:'タロウ', part:'clarinet', roles:['admin'], category:'regular', joined_date:'2020-04-01', email:'yamada@example.com', phone:'090-0000-0001', birthday:'1995-08-15', emergency_contact:'山田 花子：母：090-0000-0099', created_at:'2020-04-01T00:00:00Z', is_part_leader:true },
  { id:'2', last_name:'鈴木', first_name:'花子', last_kana:'スズキ', first_kana:'ハナコ', part:'flute', roles:['conductor'], category:'regular', joined_date:'2019-04-01', email:'suzuki@example.com', phone:'090-0000-0002', birthday:'1990-03-22', emergency_contact:'', created_at:'2019-04-01T00:00:00Z', is_part_leader:false },
  { id:'3', last_name:'田中', first_name:'一郎', last_kana:'タナカ', first_kana:'イチロウ', part:'trumpet', roles:['manager'], category:'regular', joined_date:'2021-09-01', email:'tanaka@example.com', phone:'', birthday:'', emergency_contact:'', created_at:'2021-09-01T00:00:00Z', is_part_leader:false },
  { id:'4', last_name:'佐藤', first_name:'美咲', last_kana:'サトウ', first_kana:'ミサキ', part:'horn', roles:['treasurer'], category:'regular', joined_date:'2022-04-01', email:'sato@example.com', phone:'090-0000-0004', birthday:'1998-12-01', emergency_contact:'', created_at:'2022-04-01T00:00:00Z', is_part_leader:true },
  { id:'5', last_name:'伊藤', first_name:'健太', last_kana:'イトウ', first_kana:'ケンタ', part:'trombone', roles:['librarian'], category:'regular', joined_date:'2023-04-01', email:'ito@example.com', phone:'', birthday:'', emergency_contact:'', created_at:'2023-04-01T00:00:00Z', is_part_leader:false },
  { id:'6', last_name:'渡辺', first_name:'さくら', last_kana:'ワタナベ', first_kana:'サクラ', part:'saxophone', roles:['member'], category:'regular', joined_date:'2022-09-01', email:'watanabe@example.com', phone:'', birthday:'', emergency_contact:'', created_at:'2022-09-01T00:00:00Z', is_part_leader:false },
  { id:'7', last_name:'中村', first_name:'大輔', last_kana:'ナカムラ', first_kana:'ダイスケ', part:'tuba', roles:['member'], category:'regular', joined_date:'2024-04-01', email:'nakamura@example.com', phone:'', birthday:'', emergency_contact:'', created_at:'2024-04-01T00:00:00Z', is_part_leader:false },
  { id:'8', last_name:'小林', first_name:'恵', last_kana:'コバヤシ', first_kana:'メグミ', part:'percussion', roles:['member'], category:'trainee', joined_date:'2024-10-01', email:'kobayashi@example.com', phone:'', birthday:'', emergency_contact:'', created_at:'2024-10-01T00:00:00Z', is_part_leader:false },
  { id:'9', last_name:'加藤', first_name:'浩二', last_kana:'カトウ', first_kana:'コウジ', part:'euphonium', roles:['member'], category:'rest', joined_date:'2021-04-01', email:'kato@example.com', phone:'', birthday:'', emergency_contact:'', created_at:'2021-04-01T00:00:00Z', is_part_leader:false },
];

let allMembers = [];

// ─── 権限チェック：ログイン者が詳細閲覧可能か ───
function canViewDetail() {
  const user = getSessionUser();
  if (!user) return false;
  const userRoles = Array.isArray(user.roles) ? user.roles : [user.role].filter(Boolean);
  return userRoles.some(r => DETAIL_ROLES.includes(r));
}

// ─── 在籍開始年月フォーマット ───
function formatJoinedDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '—';
  return `${d.getFullYear()}年${d.getMonth() + 1}月`;
}

// ─── 生年月日フォーマット ───
function formatBirthday(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '—';
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

// ─── 登録日時フォーマット ───
function formatCreatedAt(tsStr) {
  if (!tsStr) return '—';
  const d = new Date(tsStr);
  if (isNaN(d.getTime())) return '—';
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

// ─── XSS対策 ───

// ─── 絞り込みプルダウン生成（区分・役職・楽器） ───
function buildFilterOptions(members) {
  const opt = (v, l) => `<option value="${escHtml(v)}">${escHtml(l)}</option>`;

  // 区分：config.js の MEMBER_CATEGORY_LABELS（単一の定義元）
  document.getElementById('filter-category').innerHTML =
    opt('', '全区分') +
    Object.entries(MEMBER_CATEGORY_LABELS).map(([v, l]) => opt(v, l)).join('');

  // 役職：common.js の ROLE_DEFINITIONS（バッジと同じ定義）
  document.getElementById('filter-role').innerHTML =
    opt('', '全役職') +
    ROLE_DEFINITIONS.map(d => opt(d.value, d.label)).join('');

  // 楽器：PART_GROUPS の順。定義に無いパートの団員がいれば末尾に足す
  const known = new Set(PART_GROUPS.flatMap(g => g.parts));
  const extra = [...new Set(members.map(m => m.part).filter(p => p && !known.has(p)))].sort();
  document.getElementById('filter-part').innerHTML =
    opt('', '全楽器') +
    PART_GROUPS.map(g => `<optgroup label="${escHtml(g.label)}">${g.parts.map(p => opt(p, PART_LABELS[p] ?? p)).join('')}</optgroup>`).join('') +
    (extra.length ? `<optgroup label="未分類">${extra.map(p => opt(p, PART_LABELS[p] ?? p)).join('')}</optgroup>` : '');
}

// ─── リスト描画 ───
function renderList() {
  const keyword    = document.getElementById('search-input').value.trim().toLowerCase();
  const category   = document.getElementById('filter-category').value;
  const roleFilter = document.getElementById('filter-role').value;
  const partFilter = document.getElementById('filter-part').value;
  const showDetail = canViewDetail();

  const filtered = allMembers.filter(m => {
    const name = `${m.last_name}${m.first_name}${m.last_kana}${m.first_kana}`.toLowerCase();
    if (keyword && !name.includes(keyword)) return false;
    if (category && m.category !== category) return false;
    if (roleFilter) {
      const memberRoles = Array.isArray(m.roles) ? m.roles : [m.role].filter(Boolean);
      if (!memberRoles.includes(roleFilter)) return false;
    }
    if (partFilter && m.part !== partFilter) return false;
    return true;
  });

  document.getElementById('member-count').textContent = `${filtered.length}名`;

  const listEl = document.getElementById('member-list');
  if (filtered.length === 0) {
    listEl.innerHTML = `<div style="text-align:center;padding:var(--space-16);color:var(--gray-500);">該当する団員が見つかりません</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(m => {
    const memberRoles = Array.isArray(m.roles) ? m.roles : [m.role].filter(Boolean);
    const roleBadges  = typeof renderRoleBadges === 'function' ? renderRoleBadges(memberRoles) : '';

    return `
      <div class="member-row">
        <div class="member-row__info">
          <div class="member-row__line1">
            <span class="member-row__name">${escHtml(m.last_name)} ${escHtml(m.first_name)}</span>
            <span class="member-row__kana">${escHtml(m.last_kana)} ${escHtml(m.first_kana)}</span>
            ${CAT_LABELS[m.category] ? `<span class="member-row__cat">${escHtml(CAT_LABELS[m.category])}</span>` : ''}
          </div>
          <div class="member-row__line2">
            <span class="member-row__part">${escHtml(PART_LABELS[m.part] ?? '—')}</span>
            <div class="member-row__badges">
              ${roleBadges}
              ${m.is_part_leader ? '<span class="badge badge-warning">PL</span>' : ''}
            </div>
            <span class="member-row__joined">${escHtml(formatJoinedDate(m.joined_date))}〜</span>
          </div>
        </div>
        ${showDetail ? `
          <div class="member-row__action">
            <button class="btn btn-sm btn-outline" onclick="openDetailModal('${escHtml(m.id)}')">詳細</button>
          </div>
        ` : ''}
      </div>`;
  }).join('');
}

// ─── 詳細モーダル ───
function openDetailModal(memberId) {
  if (!canViewDetail()) return;

  const m = allMembers.find(x => x.id === memberId);
  if (!m) return;

  const memberRoles = Array.isArray(m.roles) ? m.roles : [m.role].filter(Boolean);
  const roleBadges  = typeof renderRoleBadges === 'function' ? renderRoleBadges(memberRoles) : memberRoles.join(', ');
  const catCls      = CATEGORY_BADGE[m.category] ?? 'badge-navy';

  document.getElementById('detail-modal-title').textContent =
    `${m.last_name} ${m.first_name}`;

  document.getElementById('detail-modal-body').innerHTML = `
    <p class="detail-section-label">基本情報</p>
    <dl class="detail-dl">
      <dt>氏名</dt>
      <dd>${escHtml(m.last_name)} ${escHtml(m.first_name)}</dd>
      <dt>フリガナ</dt>
      <dd>${escHtml(m.last_kana)} ${escHtml(m.first_kana)}</dd>
      <dt>パート</dt>
      <dd>${escHtml(PART_LABELS[m.part] ?? '—')}</dd>
      <dt>役職</dt>
      <dd><span style="display:inline-flex;gap:4px;flex-wrap:wrap;">${roleBadges}</span></dd>
      <dt>PL</dt>
      <dd>${m.is_part_leader ? '<span class="badge badge-warning">パートリーダー</span>' : '—'}</dd>
      <dt>区分</dt>
      <dd><span class="badge ${catCls}">${escHtml(CAT_LABELS[m.category] ?? '—')}</span></dd>
      <dt>在籍開始</dt>
      <dd>${escHtml(formatJoinedDate(m.joined_date))}</dd>
    </dl>

    <p class="detail-section-label">連絡先情報</p>
    <dl class="detail-dl">
      <dt>メール</dt>
      <dd>${escHtml(m.email || '—')}</dd>
      <dt>電話番号</dt>
      <dd>${escHtml(m.phone || '—')}</dd>
      <dt>生年月日</dt>
      <dd>${escHtml(formatBirthday(m.birthday))}</dd>
      <dt>緊急連絡先</dt>
      <dd style="white-space:pre-wrap;">${escHtml(m.emergency_contact || '—')}</dd>
    </dl>

    <p class="detail-section-label">システム情報</p>
    <dl class="detail-dl">
      <dt>ユーザーID</dt>
      <dd style="font-size:var(--text-xs);color:var(--gray-400);">${escHtml(m.id)}</dd>
      <dt>登録日</dt>
      <dd>${escHtml(formatCreatedAt(m.created_at))}</dd>
    </dl>
  `;

  openModal('modal-detail');
}

document.addEventListener('DOMContentLoaded', async () => {
  const isDev = !!window._hsDevHost?.local;

  async function loadMembersPage() {
    const { data, error } = await DB.profiles.list();
    if (error || (!_sb && !isDev)) {
      Net.showError(document.getElementById('member-list'), loadMembersPage,
        '団員データを取得できませんでした。');
      return;
    }
    // デモデータは開発環境（localhost）かつ未接続のときだけ
    allMembers = (data.length === 0 && isDev) ? DEMO_MEMBERS : data;
    buildFilterOptions(allMembers);
    renderList();
  }
  await loadMembersPage();

  document.getElementById('search-input').addEventListener('input', renderList);
  document.getElementById('filter-category').addEventListener('change', renderList);
  document.getElementById('filter-role').addEventListener('change', renderList);
  document.getElementById('filter-part').addEventListener('change', renderList);
});
</script>
</body>
</html>
