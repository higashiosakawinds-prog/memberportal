<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>団員申請 — 東大阪吹奏楽団</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── タブ ── */
    .req-tabs { display:flex;gap:0;border-bottom:2px solid var(--gray-200);margin-bottom:var(--space-6);flex-wrap:wrap; }
    .req-tab {
      padding:var(--space-3) var(--space-5);font-size:var(--text-sm);font-weight:500;
      color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
      transition:all var(--transition-fast);background:none;
      border-top:none;border-left:none;border-right:none;white-space:nowrap;
    }
    .req-tab:hover { color:var(--navy-700); }
    .req-tab.active { color:var(--navy-800);border-bottom-color:var(--gold-500);font-weight:700; }
    .req-panel { display:none; }
    .req-panel.active { display:block; }

    /* ── 申請カード ── */
    .sm-card {
      background:var(--white);border:1px solid var(--gray-200);
      border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-4);
      transition:box-shadow var(--transition-base);
    }
    .sm-card:hover { box-shadow:var(--shadow-sm); }
    .sm-card__header { display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap; }
    .sm-card__name { font-size:var(--text-lg);font-weight:700;color:var(--navy-800); }
    .sm-card__meta { font-size:var(--text-xs);color:var(--gray-500);margin-top:4px; }
    .sm-card__reason {
      margin-top:var(--space-3);padding:var(--space-3) var(--space-4);
      background:var(--gray-100);border-radius:var(--radius-md);
      font-size:var(--text-sm);color:var(--gray-700);line-height:1.7;
    }
    .sm-card__months {
      display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:var(--space-3);margin-top:var(--space-4);
    }
    .sm-month-item { font-size:var(--text-xs); }
    .sm-month-item__label { color:var(--gray-500);margin-bottom:2px; }
    .sm-month-item__value { font-weight:700;color:var(--navy-800);font-size:var(--text-sm); }
    .sm-card__actions { display:flex;gap:var(--space-3);margin-top:var(--space-4);flex-wrap:wrap; }

    .status-badge {
      display:inline-flex;align-items:center;gap:4px;
      padding:2px 10px;border-radius:var(--radius-full);
      font-size:var(--text-xs);font-weight:700;
    }
    .status-pending  { background:rgba(230,126,34,.12);color:#ca6f1e; }
    .status-approved { background:rgba(39,174,96,.12);color:var(--success); }
    .status-rejected { background:rgba(192,57,43,.12);color:var(--danger); }
    .status-expired  { background:var(--gray-200);color:var(--gray-500); }

    .empty-state {
      text-align:center;padding:var(--space-16);color:var(--gray-400);
    }
    .empty-state svg { margin:0 auto var(--space-4); }

    @media(max-width:640px){
      .req-tab { padding:var(--space-2) var(--space-3);font-size:var(--text-xs); }
    }
  </style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <div class="page-header fade-in">
      <div>
        <p class="page-header__eyebrow">REQUESTS</p>
        <h1 class="page-header__title">団員申請</h1>
      </div>
    </div>

    <!-- 権限なし表示 -->
    <div id="no-permission" style="display:none;">
      <div class="card">
        <div class="card__body" style="text-align:center;padding:var(--space-16);color:var(--gray-500);">
          <p style="font-size:var(--text-lg);font-weight:700;color:var(--navy-800);margin-bottom:var(--space-2);">閲覧権限がありません</p>
          <p style="font-size:var(--text-sm);">このページは幹部のみが閲覧できます。</p>
        </div>
      </div>
    </div>

    <!-- 特例制度管理セクション（幹部のみ） -->
    <div id="sm-section" style="display:none;">

      <div class="req-tabs fade-in fade-in-1">
        <button class="req-tab active" data-tab="pending">
          未対応
          <span class="sidebar-badge" id="pending-count-badge" style="display:none;margin-left:6px;"></span>
        </button>
        <button class="req-tab" data-tab="approved">承認済み</button>
        <button class="req-tab" data-tab="rejected">否認済み</button>
        <button class="req-tab" data-tab="all">すべて</button>
        <button class="req-tab" data-tab="opinions">
          意見箱
          <span class="sidebar-badge" id="opinion-count-badge" style="display:none;margin-left:6px;"></span>
        </button>
      </div>

      <!-- 未対応 -->
      <div class="req-panel active" id="panel-pending">
        <div id="list-pending">
          <div style="text-align:center;padding:var(--space-10);"><div class="loading-spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>

      <!-- 承認済み -->
      <div class="req-panel" id="panel-approved">
        <div id="list-approved">
          <div style="text-align:center;padding:var(--space-10);"><div class="loading-spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>

      <!-- 否認済み -->
      <div class="req-panel" id="panel-rejected">
        <div id="list-rejected">
          <div style="text-align:center;padding:var(--space-10);"><div class="loading-spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>

      <!-- すべて -->
      <div class="req-panel" id="panel-all">
        <div id="list-all">
          <div style="text-align:center;padding:var(--space-10);"><div class="loading-spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>

      <!-- 意見箱 -->
      <div class="req-panel" id="panel-opinions">
        <div id="list-opinions">
          <div style="text-align:center;padding:var(--space-10);"><div class="loading-spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>

    </div><!-- /sm-section -->

  </main>
</div>

<!-- 承認モーダル -->
<div class="modal-overlay" id="modal-approve">
  <div class="modal" style="max-width:520px;">
    <div class="modal__header">
      <h2 class="modal__title">特例制度を承認する</h2>
      <button class="modal__close" onclick="closeModal('modal-approve')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal__body">
      <div class="alert alert-info mb-5">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>
        <span>承認すると、団費が半額（50%）になります。開始月は必要に応じて変更できます。</span>
      </div>

      <div style="background:var(--gray-100);border-radius:var(--radius-md);padding:var(--space-4);margin-bottom:var(--space-5);">
        <p style="font-size:var(--text-xs);color:var(--gray-500);margin-bottom:2px;">申請者</p>
        <p style="font-weight:700;color:var(--navy-800);" id="approve-name"></p>
        <p style="font-size:var(--text-xs);color:var(--gray-500);margin-top:var(--space-2);">申請理由</p>
        <p style="font-size:var(--text-sm);color:var(--gray-700);margin-top:2px;" id="approve-reason"></p>
      </div>

      <div class="form-group">
        <label class="form-label">
          特例開始月
          <span style="font-size:var(--text-xs);font-weight:400;color:var(--gray-400);">（申請希望月から変更可能）</span>
        </label>
        <select id="approve-start-month" class="form-control" style="max-width:200px;" onchange="onApproveStartMonthChange()"></select>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-5);">
        <div>
          <p style="font-size:var(--text-xs);color:var(--gray-500);margin-bottom:4px;">終了月（6か月後）</p>
          <p style="font-weight:700;color:var(--navy-800);" id="approve-end-month"></p>
        </div>
        <div>
          <p style="font-size:var(--text-xs);color:var(--gray-500);margin-bottom:4px;">再申請延長終了月（12か月後）</p>
          <p style="font-weight:700;color:var(--gray-500);" id="approve-ext-end-month"></p>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">備考（任意）</label>
        <textarea id="approve-notes" class="form-control" rows="3" placeholder="団員への伝達事項など（任意）"></textarea>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn-danger" id="btn-reject-from-approve" onclick="rejectApplication()">否認する</button>
      <button class="btn btn-outline" onclick="closeModal('modal-approve')">キャンセル</button>
      <button class="btn btn-gold" onclick="approveApplication()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
        承認する
      </button>
    </div>
  </div>
</div>

<!-- 休団・退団申請 審査モーダル -->
<div class="modal-overlay" id="modal-status-review">
  <div class="modal" style="max-width:480px;">
    <div class="modal__header">
      <h2 class="modal__title" id="status-review-title">申請を確認する</h2>
      <button class="modal__close" onclick="closeModal('modal-status-review')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal__body">
      <div style="background:var(--gray-100);border-radius:var(--radius-md);padding:var(--space-4);margin-bottom:var(--space-5);">
        <p style="font-size:var(--text-xs);color:var(--gray-500);margin-bottom:2px;">申請者</p>
        <p style="font-weight:700;color:var(--navy-800);" id="status-review-name"></p>
        <p style="font-size:var(--text-xs);color:var(--gray-500);margin-top:var(--space-3);" id="status-review-date-label"></p>
        <p style="font-size:var(--text-xs);color:var(--gray-500);margin-top:var(--space-3);">申請理由</p>
        <p style="font-size:var(--text-sm);color:var(--gray-700);margin-top:2px;white-space:pre-wrap;" id="status-review-reason"></p>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">備考（任意・申請者にも表示されます）</label>
        <textarea id="status-review-notes" class="form-control" rows="3" placeholder="団員への伝達事項など（任意）"></textarea>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn-danger" onclick="rejectStatusRequest()">否認する</button>
      <button class="btn btn-outline" onclick="closeModal('modal-status-review')">キャンセル</button>
      <button class="btn btn-gold" onclick="approveStatusRequest()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
        承認する
      </button>
    </div>
  </div>
</div>


<!-- 団員とのやり取りモーダル（申請チャット） -->
<div class="modal-overlay" id="modal-request-chat">
  <div class="modal" style="max-width:520px;">
    <div class="modal__header">
      <h2 class="modal__title" id="rc-title">団員とのやり取り</h2>
      <button class="modal__close" onclick="closeRequestChat()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal__body">
      <div id="rc-chat-wrap" style="max-height:360px;overflow-y:auto;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
        <div style="text-align:center;color:var(--gray-400);font-size:var(--text-sm);">読み込み中…</div>
      </div>
      <div style="margin-top:var(--space-3);">
        <textarea id="rc-compose" class="form-control" rows="3" placeholder="メッセージを入力…" style="resize:vertical;"></textarea>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn-outline" onclick="closeRequestChat()">閉じる</button>
      <button class="btn btn-gold" id="rc-send-btn" onclick="sendRequestChatMessage()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
        送信
      </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="../js/supabase.js"></script>
<script src="../js/common.js"></script>
<script>
// ══════════════════════════════════════
//  状態
// ══════════════════════════════════════
let allApplications   = [];   // special_measures rows
let allStatusRequests = [];   // member_status_requests rows（休団・退団）
let allUnified         = [];  // 上記2つをマージし種別タグを付けた一覧
let pendingTarget      = null; // 特例制度：承認モーダル用
let pendingStatusTarget = null; // 休団・退団：審査モーダル用
let memberMap          = {};   // { id: {last_name, first_name, ...} }
let allOpinions         = [];  // opinions テーブル一覧

// 団員とのやり取り（申請チャット）用の状態
let rcCurrent   = null; // { requestType, requestId, isLeaderView }
let rcMessages  = [];
let rcPollTimer = null;

const TYPE_META = {
  special:  { label: '特例制度', badge: 'badge-gold' },
  rest:     { label: '休団申請', badge: 'badge-warning' },
  withdraw: { label: '退団申請', badge: 'badge-danger' },
};

// ══════════════════════════════════════
//  ユーティリティ
// ══════════════════════════════════════
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtMonth(ym) {
  if (!ym) return '—';
  const [y, m] = ym.split('-');
  return `${y}年${parseInt(m)}月`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('ja-JP', { year:'numeric', month:'short', day:'numeric' });
}

// YYYY-MM-DD 形式の date 型カラム用（休団・退団申請の希望日など）
function fmtDateOnly(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt.getTime())) return escHtml(d);
  return dt.toLocaleDateString('ja-JP', { year:'numeric', month:'short', day:'numeric' });
}

function addMonths(yyyyMM, n) {
  const [y, m] = yyyyMM.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function getCurrentMonth() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}

function statusBadge(status) {
  const map = {
    pending:  ['status-pending',  '審査中'],
    approved: ['status-approved', '承認済み'],
    rejected: ['status-rejected', '否認'],
    expired:  ['status-expired',  '期間終了'],
  };
  const [cls, label] = map[status] ?? ['status-expired', status];
  return `<span class="status-badge ${cls}">${label}</span>`;
}

function memberName(memberId) {
  const m = memberMap[memberId];
  return m ? `${m.last_name} ${m.first_name}` : '（不明）';
}

// ══════════════════════════════════════
//  データ読み込み
// ══════════════════════════════════════
async function loadData() {
  if (!_sb) return;

  // profiles をまず取得
  const { data: profiles } = await _sb
    .from('profiles')
    .select('id, last_name, first_name, category, part');
  (profiles ?? []).forEach(p => { memberMap[p.id] = p; });

  // 特例制度（special_measures）と休団・退団申請（member_status_requests）を並行取得
  const [smRes, statusRes] = await Promise.all([
    _sb.from('special_measures').select('*').order('applied_at', { ascending: false }),
    _sb.from('member_status_requests').select('*').order('applied_at', { ascending: false }),
  ]);

  if (smRes.error)     console.warn('特例制度取得失敗:', smRes.error.message);
  if (statusRes.error) console.warn('休団・退団申請取得失敗:', statusRes.error.message);

  allApplications   = smRes.data ?? [];
  allStatusRequests = statusRes.data ?? [];
  allUnified        = buildUnifiedList();
}

// 特例制度・休団申請・退団申請を種別タグ付きで1つの配列にまとめる
function buildUnifiedList() {
  const special = allApplications.map(sm => ({
    uid:       `special_${sm.id}`,
    type:      'special',
    id:        sm.id,
    member_id: sm.member_id,
    status:    sm.status,
    applied_at: sm.applied_at,
    raw:       sm,
  }));

  const statusReqs = allStatusRequests.map(r => ({
    uid:       `${r.request_type}_${r.id}`,
    type:      r.request_type, // 'rest' | 'withdraw'
    id:        r.id,
    member_id: r.member_id,
    status:    r.status,
    applied_at: r.applied_at,
    raw:       r,
  }));

  return [...special, ...statusReqs].sort((a, b) =>
    new Date(b.applied_at ?? 0) - new Date(a.applied_at ?? 0));
}

// ══════════════════════════════════════
//  リスト描画
// ══════════════════════════════════════
const CAT_LABELS = {
  regular:'正団員', regular_student:'正団員（学生）',
  trainee:'準団員', support:'スタッフ', rest:'休団中',
};

function renderSpecialCard(sm) {
  const name   = escHtml(memberName(sm.member_id));
  const cat    = escHtml(CAT_LABELS[memberMap[sm.member_id]?.category] ?? '—');
  const now    = getCurrentMonth();
  const active = sm.status === 'approved'
    && sm.actual_start_month <= now && now <= sm.actual_end_month;
  const meta   = TYPE_META.special;

  return `
    <div class="sm-card">
      <div class="sm-card__header">
        <div>
          <div class="sm-card__name">
            ${name}
            <span class="badge ${meta.badge}" style="font-size:10px;margin-left:6px;">${meta.label}</span>
            ${active ? '<span class="badge badge-gold" style="font-size:10px;margin-left:4px;">特例中</span>' : ''}
          </div>
          <div class="sm-card__meta">
            ${cat}　／　申請日：${fmtDate(sm.applied_at)}
          </div>
        </div>
        ${statusBadge(sm.status)}
      </div>

      <div class="sm-card__reason">
        <span style="font-size:var(--text-xs);color:var(--gray-400);display:block;margin-bottom:4px;">申請理由</span>
        ${escHtml(sm.reason || '（理由未記入）')}
      </div>

      <div class="sm-card__months">
        <div class="sm-month-item">
          <div class="sm-month-item__label">申請希望開始月</div>
          <div class="sm-month-item__value">${fmtMonth(sm.requested_start_month)}</div>
        </div>
        <div class="sm-month-item">
          <div class="sm-month-item__label">基本終了月（6か月後）</div>
          <div class="sm-month-item__value">${fmtMonth(sm.end_month)}</div>
        </div>
        <div class="sm-month-item">
          <div class="sm-month-item__label">延長終了月（12か月後）</div>
          <div class="sm-month-item__value" style="color:var(--gray-500);">${fmtMonth(sm.extended_end_month)}</div>
        </div>
        ${sm.status === 'approved' ? `
          <div class="sm-month-item">
            <div class="sm-month-item__label">確定開始月</div>
            <div class="sm-month-item__value" style="color:var(--success);">${fmtMonth(sm.actual_start_month)}</div>
          </div>
          <div class="sm-month-item">
            <div class="sm-month-item__label">確定終了月</div>
            <div class="sm-month-item__value" style="color:var(--success);">${fmtMonth(sm.actual_end_month)}</div>
          </div>` : ''}
      </div>

      ${sm.notes ? `
        <div style="margin-top:var(--space-3);font-size:var(--text-xs);color:var(--gray-500);">
          備考：${escHtml(sm.notes)}
        </div>` : ''}

      <div class="sm-card__actions">
        <button class="btn btn-sm btn-outline" onclick="openRequestChat('special','${sm.id}','${name} さんとのやり取り',true)">
          💬 やり取りする
          <span id="chatbadge-special-${sm.id}" class="badge badge-danger" style="display:none;margin-left:4px;"></span>
        </button>
      </div>

      ${sm.status === 'pending' ? `
        <div class="sm-card__actions">
          <button class="btn btn-gold" onclick="openApproveModal('${sm.id}')">審査する</button>
        </div>` : ''}

      ${sm.status === 'approved' ? `
        <div class="sm-card__actions">
          <button class="btn btn-sm btn-outline" onclick="openApproveModal('${sm.id}')">内容を変更</button>
          <button class="btn btn-sm btn-danger" onclick="revokeApproval('${sm.id}')">取り消す</button>
        </div>` : ''}
    </div>`;
}

// 休団申請・退団申請カード
function renderStatusCard(item) {
  const r    = item.raw;
  const meta = TYPE_META[item.type];
  const name = escHtml(memberName(r.member_id));
  const cat  = escHtml(CAT_LABELS[memberMap[r.member_id]?.category] ?? '—');

  const dateLine = item.type === 'rest'
    ? `休団開始希望日：${fmtDateOnly(r.desired_date)}${r.return_date ? `　／　復帰予定日：${fmtDateOnly(r.return_date)}` : ''}`
    : `退団希望日：${fmtDateOnly(r.desired_date)}`;

  return `
    <div class="sm-card">
      <div class="sm-card__header">
        <div>
          <div class="sm-card__name">
            ${name}
            <span class="badge ${meta.badge}" style="font-size:10px;margin-left:6px;">${meta.label}</span>
          </div>
          <div class="sm-card__meta">
            ${cat}　／　申請日：${fmtDate(r.applied_at)}
          </div>
        </div>
        ${statusBadge(r.status)}
      </div>

      <p style="font-size:var(--text-xs);color:var(--gray-500);margin-top:var(--space-3);">${escHtml(dateLine)}</p>

      <div class="sm-card__reason">
        <span style="font-size:var(--text-xs);color:var(--gray-400);display:block;margin-bottom:4px;">申請理由</span>
        ${escHtml(r.reason || '（理由未記入）')}
      </div>

      ${r.notes ? `
        <div style="margin-top:var(--space-3);font-size:var(--text-xs);color:var(--gray-500);">
          備考：${escHtml(r.notes)}
        </div>` : ''}

      <div class="sm-card__actions">
        <button class="btn btn-sm btn-outline" onclick="openRequestChat('${item.type}','${r.id}','${name} さんとのやり取り',true)">
          💬 やり取りする
          <span id="chatbadge-${item.type}-${r.id}" class="badge badge-danger" style="display:none;margin-left:4px;"></span>
        </button>
      </div>

      ${r.status === 'pending' ? `
        <div class="sm-card__actions">
          <button class="btn btn-gold" onclick="openStatusReviewModal('${item.uid}')">審査する</button>
        </div>` : ''}

      ${(r.status === 'approved' || r.status === 'rejected') ? `
        <div class="sm-card__actions">
          <button class="btn btn-sm btn-outline" onclick="openStatusReviewModal('${item.uid}')">内容を確認・変更</button>
        </div>` : ''}
    </div>`;
}

// 種別に応じて描画を振り分ける
function renderUnifiedCard(item) {
  return item.type === 'special' ? renderSpecialCard(item.raw) : renderStatusCard(item);
}

function renderList(targetId, items) {
  const el = document.getElementById(targetId);
  if (!el) return;
  if (items.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1" width="48" height="48" style="opacity:.3;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/>
        </svg>
        <p style="font-size:var(--text-sm);">申請はありません</p>
      </div>`;
    return;
  }
  el.innerHTML = items.map(renderUnifiedCard).join('');
}

function renderAllLists() {
  const pending  = allUnified.filter(i => i.status === 'pending');
  const approved = allUnified.filter(i => i.status === 'approved');
  const rejected = allUnified.filter(i => i.status === 'rejected');

  renderList('list-pending',  pending);
  renderList('list-approved', approved);
  renderList('list-rejected', rejected);
  renderList('list-all',      allUnified);

  // バッジ
  const badge = document.getElementById('pending-count-badge');
  if (pending.length > 0) {
    badge.textContent = pending.length;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }

  updateAllChatBadges();
}

// ══════════════════════════════════════
//  承認モーダル
// ══════════════════════════════════════
function openApproveModal(id) {
  pendingTarget = allApplications.find(s => s.id === id);
  if (!pendingTarget) return;

  const name = memberName(pendingTarget.member_id);
  document.getElementById('approve-name').textContent   = name;
  document.getElementById('approve-reason').textContent = pendingTarget.reason || '（理由未記入）';
  document.getElementById('approve-notes').value        = pendingTarget.notes ?? '';

  // 開始月の選択肢：申請希望月 ± 3か月
  const base = pendingTarget.requested_start_month;
  const sel  = document.getElementById('approve-start-month');
  sel.innerHTML = Array.from({ length: 7 }, (_, i) => {
    const ym = addMonths(base, i - 3);
    const selected = (ym === (pendingTarget.actual_start_month ?? base)) ? 'selected' : '';
    return `<option value="${ym}" ${selected}>${fmtMonth(ym)}${ym === base ? '（申請希望）' : ''}</option>`;
  }).join('');

  onApproveStartMonthChange();
  openModal('modal-approve');
}

function onApproveStartMonthChange() {
  const start = document.getElementById('approve-start-month').value;
  document.getElementById('approve-end-month').textContent     = fmtMonth(addMonths(start, 6));
  document.getElementById('approve-ext-end-month').textContent = fmtMonth(addMonths(start, 12));
}

async function approveApplication() {
  if (!pendingTarget || !_sb) return;

  const startMonth = document.getElementById('approve-start-month').value;
  const endMonth   = addMonths(startMonth, 6);
  const notes      = document.getElementById('approve-notes').value.trim();
  const user       = getSessionUser();

  const btn = document.querySelector('#modal-approve .btn-gold');
  btn.disabled = true; btn.textContent = '処理中…';

  const { error } = await _sb.from('special_measures').update({
    status:             'approved',
    actual_start_month: startMonth,
    actual_end_month:   endMonth,
    approved_at:        new Date().toISOString(),
    approved_by:        user?.id ?? null,
    notes,
    // 否認情報をクリア（再承認ケース）
    rejected_at:        null,
    rejected_by:        null,
  }).eq('id', pendingTarget.id);

  btn.disabled = false; btn.textContent = '承認する';

  if (error) {
    showToast('承認処理に失敗しました: ' + error.message, 'error');
    return;
  }

  showToast(`${memberName(pendingTarget.member_id)} さんの特例制度を承認しました`, 'success');
  closeModal('modal-approve');
  pendingTarget = null;
  await loadData();
  renderAllLists();
}

async function rejectApplication() {
  if (!pendingTarget || !_sb) return;

  const user = getSessionUser();
  if (!confirm(`${memberName(pendingTarget.member_id)} さんの申請を否認しますか？`)) return;

  const notes = document.getElementById('approve-notes').value.trim();

  const { error } = await _sb.from('special_measures').update({
    status:      'rejected',
    rejected_at: new Date().toISOString(),
    rejected_by: user?.id ?? null,
    notes,
    // 承認情報をクリア
    actual_start_month: null,
    actual_end_month:   null,
    approved_at:        null,
    approved_by:        null,
  }).eq('id', pendingTarget.id);

  if (error) {
    showToast('否認処理に失敗しました: ' + error.message, 'error');
    return;
  }

  showToast(`${memberName(pendingTarget.member_id)} さんの申請を否認しました`, 'success');
  closeModal('modal-approve');
  pendingTarget = null;
  await loadData();
  renderAllLists();
}

async function revokeApproval(id) {
  if (!_sb) return;
  const sm = allApplications.find(s => s.id === id);
  if (!sm) return;
  if (!confirm(`${memberName(sm.member_id)} さんの特例制度承認を取り消しますか？`)) return;

  const { error } = await _sb.from('special_measures').update({
    status:             'rejected',
    actual_start_month: null,
    actual_end_month:   null,
    approved_at:        null,
    approved_by:        null,
    rejected_at:        new Date().toISOString(),
    rejected_by:        getSessionUser()?.id ?? null,
  }).eq('id', id);

  if (error) {
    showToast('取り消しに失敗しました: ' + error.message, 'error');
    return;
  }

  showToast('特例制度を取り消しました', 'success');
  await loadData();
  renderAllLists();
}

// ══════════════════════════════════════
//  休団・退団申請 審査モーダル
// ══════════════════════════════════════
function openStatusReviewModal(uid) {
  const item = allUnified.find(x => x.uid === uid);
  if (!item || item.type === 'special') return;
  pendingStatusTarget = item;

  const r    = item.raw;
  const meta = TYPE_META[item.type];

  document.getElementById('status-review-title').textContent = `${meta.label}を確認する`;
  document.getElementById('status-review-name').textContent  = memberName(r.member_id);

  const dateLabel = item.type === 'rest'
    ? `休団開始希望日：${fmtDateOnly(r.desired_date)}${r.return_date ? `　／　復帰予定日：${fmtDateOnly(r.return_date)}` : ''}`
    : `退団希望日：${fmtDateOnly(r.desired_date)}`;
  document.getElementById('status-review-date-label').textContent = dateLabel;
  document.getElementById('status-review-reason').textContent     = r.reason || '（理由未記入）';
  document.getElementById('status-review-notes').value            = r.notes ?? '';

  openModal('modal-status-review');
}

async function approveStatusRequest() {
  if (!pendingStatusTarget || !_sb) return;

  const notes = document.getElementById('status-review-notes').value.trim();
  const user  = getSessionUser();

  const btn = document.querySelector('#modal-status-review .btn-gold');
  btn.disabled = true; btn.textContent = '処理中…';

  const { error } = await _sb.from('member_status_requests').update({
    status:      'approved',
    notes,
    reviewed_at: new Date().toISOString(),
    reviewed_by: user?.id ?? null,
  }).eq('id', pendingStatusTarget.id);

  btn.disabled = false;
  btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg> 承認する';

  if (error) {
    showToast('承認処理に失敗しました: ' + error.message, 'error');
    return;
  }

  showToast(`${memberName(pendingStatusTarget.member_id)} さんの${TYPE_META[pendingStatusTarget.type].label}を承認しました`, 'success');
  closeModal('modal-status-review');
  pendingStatusTarget = null;
  await loadData();
  renderAllLists();
}

async function rejectStatusRequest() {
  if (!pendingStatusTarget || !_sb) return;

  const user = getSessionUser();
  if (!confirm(`${memberName(pendingStatusTarget.member_id)} さんの申請を否認しますか？`)) return;

  const notes = document.getElementById('status-review-notes').value.trim();

  const { error } = await _sb.from('member_status_requests').update({
    status:      'rejected',
    notes,
    reviewed_at: new Date().toISOString(),
    reviewed_by: user?.id ?? null,
  }).eq('id', pendingStatusTarget.id);

  if (error) {
    showToast('否認処理に失敗しました: ' + error.message, 'error');
    return;
  }

  showToast(`${memberName(pendingStatusTarget.member_id)} さんの申請を否認しました`, 'success');
  closeModal('modal-status-review');
  pendingStatusTarget = null;
  await loadData();
  renderAllLists();
}

// ══════════════════════════════════════
//  団員とのやり取り（申請チャット・共通）
//  Supabaseの request_messages テーブルにのみ保存し、
//  Gmail連携は行いません。
// ══════════════════════════════════════
async function updateAllChatBadges() {
  if (!_sb) return;
  const { data, error } = await _sb.from('request_messages')
    .select('request_type, request_id')
    .eq('is_leader', false).eq('read_by_leader', false);
  if (error) return;
  const counts = {};
  (data ?? []).forEach(m => {
    const key = `${m.request_type}-${m.request_id}`;
    counts[key] = (counts[key] ?? 0) + 1;
  });
  Object.entries(counts).forEach(([key, cnt]) => {
    const badge = document.getElementById(`chatbadge-${key}`);
    if (badge) { badge.textContent = cnt; badge.style.display = 'inline-flex'; }
  });
}

async function openRequestChat(requestType, requestId, title, isLeaderView) {
  if (!_sb) { showToast('Supabase未接続です', 'error'); return; }
  rcCurrent = { requestType, requestId, isLeaderView };
  document.getElementById('rc-title').textContent = title || '団員とのやり取り';
  document.getElementById('rc-compose').value = '';
  openModal('modal-request-chat');
  await loadRequestChat();

  clearInterval(rcPollTimer);
  rcPollTimer = setInterval(loadRequestChat, 20000);

  // 相手からのメッセージを既読にする
  const readField = isLeaderView ? 'read_by_leader' : 'read_by_member';
  await _sb.from('request_messages')
    .update({ [readField]: true })
    .eq('request_type', requestType)
    .eq('request_id', requestId)
    .eq('is_leader', !isLeaderView);

  updateAllChatBadges();
}

function closeRequestChat() {
  clearInterval(rcPollTimer);
  rcPollTimer = null;
  closeModal('modal-request-chat');
  rcCurrent = null;
}

async function loadRequestChat() {
  if (!rcCurrent || !_sb) return;
  const { requestType, requestId } = rcCurrent;
  const { data, error } = await _sb.from('request_messages')
    .select('*')
    .eq('request_type', requestType)
    .eq('request_id', requestId)
    .order('created_at', { ascending: true });
  if (error) { console.warn('[HighasuiDX] チャット取得失敗:', error.message); return; }
  rcMessages = data ?? [];
  renderRequestChat();
}

function renderRequestChat() {
  const wrap = document.getElementById('rc-chat-wrap');
  if (!wrap || !rcCurrent) return;
  if (!rcMessages.length) {
    wrap.innerHTML = `<div style="text-align:center;color:var(--gray-400);font-size:var(--text-sm);">まだやり取りはありません。</div>`;
    return;
  }
  const fmt = iso => new Date(iso).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
  wrap.innerHTML = rcMessages.map(m => {
    const mine = rcCurrent.isLeaderView ? m.is_leader : !m.is_leader;
    return `
      <div style="align-self:${mine ? 'flex-end' : 'flex-start'};max-width:82%;display:flex;flex-direction:column;align-items:${mine ? 'flex-end' : 'flex-start'};">
        <div style="font-size:10px;color:var(--gray-400);margin-bottom:2px;padding:0 4px;">${escHtml(m.sender_name)}${m.is_leader ? '（幹部）' : ''}</div>
        <div style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);font-size:var(--text-sm);line-height:1.7;white-space:pre-wrap;word-break:break-word;
          ${mine ? 'background:var(--navy-800);color:var(--white);border-bottom-right-radius:4px;' : 'background:var(--white);color:var(--gray-800);border:1px solid var(--gray-200);border-bottom-left-radius:4px;'}">${escHtml(m.body)}</div>
        <div style="font-size:10px;color:var(--gray-400);margin-top:2px;padding:0 4px;">${escHtml(fmt(m.created_at))}</div>
      </div>`;
  }).join('');
  wrap.scrollTop = wrap.scrollHeight;
}

async function sendRequestChatMessage() {
  if (!rcCurrent || !_sb) return;
  const textarea = document.getElementById('rc-compose');
  const body = textarea.value.trim();
  if (!body) { showToast('メッセージを入力してください', 'error'); return; }
  const user = getSessionUser();
  if (!user) { showToast('ログインが必要です', 'error'); return; }

  const btn = document.getElementById('rc-send-btn');
  btn.disabled = true;

  const { error } = await _sb.from('request_messages').insert({
    request_type: rcCurrent.requestType,
    request_id:   rcCurrent.requestId,
    sender_id:    user.id,
    sender_name:  user.name ?? '—',
    is_leader:    rcCurrent.isLeaderView,
    body,
  });

  btn.disabled = false;
  if (error) { showToast('送信に失敗しました: ' + error.message, 'error'); return; }

  textarea.value = '';
  await loadRequestChat();
}

// ══════════════════════════════════════
//  意見箱（幹部側）
// ══════════════════════════════════════
async function loadOpinions() {
  if (!_sb) return;
  const { data, error } = await _sb.from('opinions').select('*').order('created_at', { ascending: false });
  if (error) { console.warn('[HighasuiDX] 意見取得失敗:', error.message); return; }
  allOpinions = data ?? [];
}

function renderOpinionsList() {
  const el = document.getElementById('list-opinions');
  if (!el) return;

  if (!allOpinions.length) {
    el.innerHTML = `
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1" width="48" height="48" style="opacity:.3;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
        </svg>
        <p style="font-size:var(--text-sm);">意見はまだありません</p>
      </div>`;
    updateOpinionBadge();
    return;
  }

  el.innerHTML = allOpinions.map(o => `
    <div class="sm-card">
      <div class="sm-card__header">
        <div>
          <div class="sm-card__name">
            ${o.is_anonymous ? '匿名団員' : escHtml(o.member_name)}
            ${o.status === 'unread'
              ? '<span class="badge badge-danger" style="font-size:10px;margin-left:6px;">未確認</span>'
              : '<span class="badge badge-success" style="font-size:10px;margin-left:6px;">確認済み</span>'}
          </div>
          <div class="sm-card__meta">送信日：${fmtDate(o.created_at)}</div>
        </div>
      </div>
      <div class="sm-card__reason">${escHtml(o.body)}</div>
      <div class="form-group" style="margin-top:var(--space-4);margin-bottom:0;">
        <label class="form-label" style="font-size:var(--text-xs);">幹部からの返信・メモ（任意）</label>
        <textarea class="form-control opinion-note-input" data-id="${o.id}" rows="2" style="resize:vertical;">${escHtml(o.admin_note ?? '')}</textarea>
      </div>
      <div class="sm-card__actions">
        <button class="btn btn-sm btn-gold" onclick="saveOpinionNote('${o.id}')">保存して確認済みにする</button>
      </div>
    </div>`).join('');

  updateOpinionBadge();
}

function updateOpinionBadge() {
  const unread = allOpinions.filter(o => o.status === 'unread').length;
  const badge = document.getElementById('opinion-count-badge');
  if (!badge) return;
  if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline-flex'; }
  else badge.style.display = 'none';
}

async function saveOpinionNote(id) {
  if (!_sb) return;
  const input = document.querySelector(`.opinion-note-input[data-id="${id}"]`);
  const note  = input?.value.trim() ?? '';

  const { error } = await _sb.from('opinions')
    .update({ admin_note: note || null, status: 'read' })
    .eq('id', id);

  if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }

  showToast('保存しました', 'success');
  await loadOpinions();
  renderOpinionsList();
}

// ══════════════════════════════════════
//  初期化
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  // 権限チェック
  if (!canDo('special_measures_admin')) {
    document.getElementById('no-permission').style.display = 'block';
    return;
  }

  document.getElementById('sm-section').style.display = 'block';

  // データ読み込み & 描画
  await loadData();
  renderAllLists();

  await loadOpinions();
  renderOpinionsList();

  // タブ切り替え
  document.querySelectorAll('.req-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.req-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.req-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
    });
  });
});
</script>
