<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- メールのリンクのトークンが Referer で外に出ないように（v1.04） -->
  <meta name="referrer" content="no-referrer">
  <title>ログイン — 東大阪吹奏楽団</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- アイコン -->
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../../apple-touch-icon-180x180.png" sizes="180x180">
  <link rel="icon" type="image/png" href="../../android-chrome-192x192.png" sizes="192x192">
  <style>
    body {
      background: var(--navy-900);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-4);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(37,77,122,0.3) 0%, transparent 60%);
      pointer-events: none;
    }
    .login-container { width: 100%; max-width: 420px; animation: fadeInUp 0.5s ease both; }
    .login-logo { text-align: center; margin-bottom: var(--space-8); }
    .login-logo__name {
      font-family: var(--font-display); font-size: var(--text-3xl);
      font-weight: 700; color: var(--white); letter-spacing: 0.05em;
      display: block; margin-bottom: var(--space-1);
    }
    .login-logo__sub { font-size: var(--text-xs); color: var(--gold-400); letter-spacing: 0.3em; text-transform: uppercase; }
    .login-logo__divider { width: 40px; height: 1px; background: var(--gold-500); margin: var(--space-3) auto; }
    .login-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(201,168,76,0.2);
      border-radius: var(--radius-xl); padding: var(--space-8); backdrop-filter: blur(12px);
    }
    .login-card h2 {
      font-family: var(--font-display); font-size: var(--text-2xl);
      font-weight: 700; color: var(--white); margin-bottom: var(--space-6); text-align: center;
    }
    .login-card .form-label { color: var(--gray-300); }
    .login-card .form-control {
      background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: var(--white);
    }
    .login-card .form-control::placeholder { color: rgba(255,255,255,0.3); }
    .login-card .form-control:focus { border-color: var(--gold-500); box-shadow: 0 0 0 3px rgba(201,168,76,0.15); }
    .login-submit {
      width: 100%; padding: var(--space-4); background: var(--gold-500); color: var(--navy-900);
      border: none; border-radius: var(--radius-md); font-size: var(--text-base); font-weight: 700;
      cursor: pointer; transition: background var(--transition-fast), box-shadow var(--transition-fast);
      margin-top: var(--space-2); font-family: var(--font-body); letter-spacing: 0.05em;
    }
    .login-submit:hover { background: var(--gold-400); box-shadow: var(--shadow-gold); }
    .login-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-footer { text-align: center; margin-top: var(--space-6); }
    .login-footer a { font-size: var(--text-sm); color: var(--gold-400); text-decoration: underline; text-underline-offset: 2px; }
    .error-box {
      background: rgba(192,57,43,0.15); border: 1px solid rgba(192,57,43,0.4);
      border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
      color: #f1948a; font-size: var(--text-sm); margin-bottom: var(--space-4); display: none;
    }
    .error-box.show { display: block; }
    .info-box {
      background: rgba(39,174,96,0.14); border: 1px solid rgba(39,174,96,0.4);
      border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
      color: #a9dfbf; font-size: var(--text-sm); line-height: 1.7; margin-bottom: var(--space-4); display: none;
    }
    .info-box.show { display: block; }
    .login-lead { font-size: var(--text-sm); color: var(--gray-300); line-height: 1.8; margin-bottom: var(--space-5); }
    .login-sublink { text-align: right; margin: calc(-1 * var(--space-2)) 0 var(--space-4); }
    .login-sublink button, .login-footer button {
      background: none; border: none; padding: 0; cursor: pointer; font-family: inherit;
      font-size: var(--text-sm); color: var(--gold-400); text-decoration: underline; text-underline-offset: 2px;
    }
    .login-resend { margin-top: var(--space-2); }
    .login-resend button {
      background: none; border: 1px solid rgba(241,148,138,0.5); color: #f1948a; cursor: pointer;
      border-radius: var(--radius-md); padding: var(--space-1) var(--space-3); font-size: var(--text-xs); font-family: inherit;
    }
  </style>
</head>
<body>
 
<div class="login-container">
  <div class="login-logo">
    <span class="login-logo__name">東大阪吹奏楽団</span>
    <div class="login-logo__divider"></div>
    <span class="login-logo__sub">HIGASUI PORTAL</span>
  </div>
 
  <div class="login-card">
    <h2 id="card-title">ログイン</h2>
    <!-- 全体メンテナンス中の案内（v1.03）。ログイン自体は止めない（IT委員がログインできるように） -->
    <div id="maint-notice" role="status" style="display:none;margin-bottom:16px;padding:10px 12px;border-radius:8px;background:#fff7e0;color:#7a5200;border:1px solid #f0d58a;font-size:13px;line-height:1.7;"></div>
    <div class="error-box" id="error-box" role="alert"></div>
    <div class="info-box" id="info-box" role="status"></div>

    <!-- ① ログイン -->
    <div id="view-login">
      <div class="form-group">
        <label class="form-label" for="email">メールアドレス <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="example@mail.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">パスワード <span class="required">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="login-sublink"><button type="button" id="to-forgot">パスワードを忘れた方</button></div>

      <button class="login-submit" id="login-btn" type="button">ログイン</button>

      <div class="login-footer">
        <a href="register.html">新規登録はこちら</a>
      </div>
    </div>

    <!-- ② パスワード再設定メールの送信（v1.04） -->
    <div id="view-forgot" hidden>
      <p class="login-lead">登録しているメールアドレスを入力してください。パスワードを設定し直すためのメールを送ります。</p>
      <div class="form-group">
        <label class="form-label" for="forgot-email">メールアドレス <span class="required">*</span></label>
        <input type="email" id="forgot-email" class="form-control" placeholder="example@mail.com" autocomplete="email">
      </div>
      <button class="login-submit" id="forgot-btn" type="button">再設定メールを送る</button>
      <div class="login-footer"><button type="button" class="to-login">ログイン画面に戻る</button></div>
    </div>

    <!-- ③ 新しいパスワードの設定（メールのリンクから開いたとき。v1.04） -->
    <div id="view-reset" hidden>
      <p class="login-lead" id="reset-lead">新しいパスワードを決めてください（8文字以上）。</p>
      <div class="form-group">
        <label class="form-label" for="new-password">新しいパスワード <span class="required">*</span></label>
        <input type="password" id="new-password" class="form-control" placeholder="8文字以上" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="new-password-confirm">新しいパスワード（確認） <span class="required">*</span></label>
        <input type="password" id="new-password-confirm" class="form-control" placeholder="もう一度入力" autocomplete="new-password">
      </div>
      <button class="login-submit" id="reset-btn" type="button">パスワードを変更する</button>
    </div>
    <p id="app-version" style="text-align:center;margin:var(--space-4) 0 0;font-size:11px;color:rgba(255,255,255,0.35);"></p>
  </div>
</div>
 
<script src="../../js/config.js"></script>
<script src="../../js/supabase.js"></script>
<script>
// ── メールのリンクから開かれたときの情報（v1.04） ──
//   ・新しい形式: ?token_hash=…&type=recovery|email（Supabase のメールテンプレートで指定。リンクを開いただけでは使われない）
//   ・従来の形式: #access_token=…&type=recovery|signup（テンプレートが既定のままの場合。Supabase クライアントが読み取る）
//   ・失敗: #error=…&error_code=otp_expired など
//   Supabase クライアントが URL を書き換える前に、ここで読んでおく
const _authLink = (() => {
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  return {
    tokenHash:    q.get('token_hash'),
    type:         q.get('type') || h.get('type') || '',
    hasHashToken: h.has('access_token'),
    error:        h.get('error_code') || h.get('error') || q.get('error_code') || q.get('error'),
  };
})();
// メールのリンクの戻り先（このログイン画面。クエリ・ハッシュは付けない）
const LOGIN_PAGE_URL = location.origin + location.pathname;
const MIN_PASSWORD_LENGTH = 8; // 新規登録（register.html）と同じ

document.addEventListener('DOMContentLoaded', () => {
  const btn      = document.getElementById('login-btn');
  const errorBox = document.getElementById('error-box');
  const infoBox  = document.getElementById('info-box');
  let currentView = 'login';

  const clearMessages = () => {
    errorBox.classList.remove('show'); errorBox.textContent = '';
    infoBox.classList.remove('show');  infoBox.textContent = '';
  };
  const showError = msg => { errorBox.textContent = msg; errorBox.classList.add('show'); };
  const showInfo  = msg => { infoBox.textContent = msg;  infoBox.classList.add('show'); };

  const TITLES = { login: 'ログイン', forgot: 'パスワードの再設定', reset: '新しいパスワードの設定' };
  const setView = name => {
    currentView = name;
    ['login', 'forgot', 'reset'].forEach(v => { document.getElementById(`view-${v}`).hidden = (v !== name); });
    document.getElementById('card-title').textContent = TITLES[name];
  };

  // ── 確認メールの再送（メール確認が済んでいないままログインしようとしたとき） ──
  const showResendButton = email => {
    const wrap = document.createElement('div');
    wrap.className = 'login-resend';
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = '確認メールをもう一度送る';
    b.addEventListener('click', async () => {
      b.disabled = true;
      const { error } = await _sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: LOGIN_PAGE_URL } });
      clearMessages();
      if (error) {
        showError(error.status === 429
          ? '短い間に何度も送信されています。しばらく待ってからお試しください。'
          : '確認メールを送れませんでした。しばらく経ってからお試しください。');
        return;
      }
      showInfo(`${email} 宛てに確認メールを送りました。メールのリンクを開いてから、ログインしてください。`);
    });
    wrap.appendChild(b);
    errorBox.appendChild(wrap);
  };

  const doLogin = async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
 
    clearMessages();
 
    if (!email || !password) {
      errorBox.textContent = 'メールアドレスとパスワードを入力してください。';
      errorBox.classList.add('show');
      return;
    }
 
    btn.disabled = true;
    btn.textContent = '認証中…';
 
    // Supabase未接続時はデモログイン
    if (!_sb) {
      setTimeout(() => {
        localStorage.setItem('hs_user', JSON.stringify({
          id: 'demo', name: 'デモユーザー', roles: ['admin'], part: '—'
        }));
        window.location.href = '../../index.html';
      }, 800);
      return;
    }
 
    const { data, error } = await _sb.auth.signInWithPassword({ email, password });
 
    if (error) {
      btn.disabled = false;
      btn.textContent = 'ログイン';
      if (error.code === 'email_not_confirmed' || /not confirmed/i.test(error.message || '')) {
        showError('メールアドレスの確認が済んでいません。登録したときに届いたメールのリンクを開いてから、ログインしてください。');
        showResendButton(email);
        return;
      }
      showError('メールアドレスまたはパスワードが正しくありません。');
      return;
    }
 
    // profiles レコードの有無を確認
    const { data: profile, error: profileError } = await _sb
      .from('profiles')
      .select('id, last_name, first_name, roles, part')
      .eq('id', data.user.id)
      .maybeSingle();
 
    // DBエラー（500など）の場合はログイン失敗として扱い、profile-setupには飛ばない
    if (profileError) {
      console.error('[HighasuiDX] profiles取得エラー:', profileError.message, profileError);
      btn.disabled = false;
      btn.textContent = 'ログイン';
      errorBox.textContent = 'ログイン処理中にエラーが発生しました。しばらく経ってから再度お試しください。';
      errorBox.classList.add('show');
      return;
    }
 
    if (!profile) {
      // profilesにレコードなし → プロフィール入力画面へ
      window.location.href = 'profile-setup.html';
      return;
    }
 
    // セッションに保存
    const roles = Array.isArray(profile.roles) && profile.roles.length > 0
      ? profile.roles
      : ['member'];
    localStorage.setItem('hs_user', JSON.stringify({
      id:    profile.id,
      name:  `${profile.last_name}${profile.first_name}`,
      roles,
      part:  profile.part,
    }));
 
    window.location.href = '../../index.html';
  };
 
  const _v = document.getElementById('app-version');
  if (_v && typeof APP_VERSION_LABEL !== 'undefined') _v.textContent = APP_VERSION_LABEL;

  // ── 全体メンテナンス中なら案内だけ出す（読めなければ何も出さない） ──
  //    ログイン画面は common.js を読まないため、日時の整形は common.js の SiteMaintenance.fmtDateTime と同じ書式をここにも書いている
  (async () => {
    try {
      if (!_sb) return;
      const { data } = await _sb.rpc('get_maintenance_status');
      if (!data || !data.active) return;
      const box = document.getElementById('maint-notice');
      let text = '現在メンテナンス中です。終了後にご利用ください。';
      if (data.planned_end) {
        const d = new Date(data.planned_end);
        if (!isNaN(d)) {
          text += `（終了予定: ${new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', weekday: 'short', hour: 'numeric', minute: '2-digit' }).format(d)}）`;
        }
      }
      box.textContent = text;
      box.style.display = 'block';
    } catch { /* 案内の失敗はログインに影響させない */ }
  })();

  // ── パスワード再設定メールの送信（v1.04） ──
  const forgotBtn = document.getElementById('forgot-btn');
  const doForgot = async () => {
    clearMessages();
    const email = document.getElementById('forgot-email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('正しいメールアドレスを入力してください。');
      return;
    }
    forgotBtn.disabled = true;
    forgotBtn.textContent = '送信中…';
    let error = null;
    if (_sb) ({ error } = await _sb.auth.resetPasswordForEmail(email, { redirectTo: LOGIN_PAGE_URL }));
    forgotBtn.disabled = false;
    forgotBtn.textContent = '再設定メールを送る';
    // 送信間隔の制限（429）は、登録済みのアドレスでしか起きないため成功と同じ表示にする（登録の有無を推測させない）
    if (error && error.status !== 429) {
      showError('メールを送れませんでした。しばらく経ってからお試しください。');
      return;
    }
    // 登録の有無は伝えない（他人のメールアドレスが登録済みかを調べられないように）
    showInfo(`${email} 宛てに再設定メールを送りました（登録されているメールアドレスの場合のみ届きます）。メールのリンクを開くとこの画面に戻り、新しいパスワードを設定できます。リンクの有効期限は1時間です。届かない場合は迷惑メールのフォルダもご確認ください。`);
  };

  // ── 新しいパスワードの設定（v1.04） ──
  const resetBtn = document.getElementById('reset-btn');
  let recoveryEmail = '';
  const doReset = async () => {
    clearMessages();
    const pw  = document.getElementById('new-password').value;
    const pw2 = document.getElementById('new-password-confirm').value;
    if (pw.length < MIN_PASSWORD_LENGTH) { showError(`パスワードは${MIN_PASSWORD_LENGTH}文字以上で設定してください。`); return; }
    if (pw !== pw2) { showError('確認用のパスワードが一致しません。'); return; }
    resetBtn.disabled = true;
    resetBtn.textContent = '変更中…';
    const { error } = await _sb.auth.updateUser({ password: pw });
    resetBtn.disabled = false;
    resetBtn.textContent = 'パスワードを変更する';
    if (error) {
      if (error.code === 'same_password') showError('今までと同じパスワードは使えません。別のパスワードにしてください。');
      else if (error.code === 'weak_password') showError('パスワードが簡単すぎます。別のパスワードにしてください。');
      else if (error.status === 401 || error.code === 'session_not_found' || error.code === 'session_expired') {
        showError('時間が経ったため、変更できませんでした。お手数ですが、もう一度再設定メールを送ってください。');
        setView('forgot');
      } else showError('パスワードを変更できませんでした。しばらく経ってからお試しください。');
      return;
    }
    // 変更後はいったんログアウトし、新しいパスワードでログインしてもらう。
    //   全端末のログアウト（他の端末は最長1時間以内＝アクセストークンの期限までに切れる）。
    //   signOut は失敗しても例外ではなく { error } を返すので、失敗時はこの端末だけでもログアウトして知らせる
    let signOutFailed = false;
    try {
      const { error: soErr } = await _sb.auth.signOut();
      if (soErr) { signOutFailed = true; await _sb.auth.signOut({ scope: 'local' }); }
    } catch { signOutFailed = true; try { await _sb.auth.signOut({ scope: 'local' }); } catch { /* 無視 */ } }
    localStorage.removeItem('hs_user');
    document.getElementById('new-password').value = '';
    document.getElementById('new-password-confirm').value = '';
    setView('login');
    if (recoveryEmail) document.getElementById('email').value = recoveryEmail;
    showInfo(signOutFailed
      ? 'パスワードを変更しました。ただし通信の都合で、ほかの端末のログアウトができなかった可能性があります。心配な場合は、少し時間をおいてもう一度パスワードを変更してください。新しいパスワードでログインしてください。'
      : 'パスワードを変更しました。新しいパスワードでログインしてください。');
    document.getElementById('password').focus();
  };

  // ── メールのリンクから開かれたときの処理（v1.04） ──
  const handleAuthLink = async () => {
    const link = _authLink;
    if (!link.tokenHash && !link.hasHashToken && !link.error) return;
    const isRecovery = link.type === 'recovery';
    let session = null, failed = !!link.error;
    if (_sb && !failed) {
      if (link.tokenHash) {
        const { data, error } = await _sb.auth.verifyOtp({ token_hash: link.tokenHash, type: isRecovery ? 'recovery' : 'email' });
        session = data?.session ?? null; failed = !!error;
      } else {
        // 従来の形式：Supabase クライアントが URL から読み取ったログイン状態を待つ
        const { data, error } = await _sb.auth.getSession();
        session = data?.session ?? null; failed = !!error;
      }
    }
    // アドレス欄からトークンを消す（再読み込み・ブックマークで使われないように）
    history.replaceState(null, '', LOGIN_PAGE_URL);

    if (failed || !session) {
      if (isRecovery || link.error) setView('forgot');
      showError(isRecovery || link.error
        ? 'メールのリンクの有効期限が切れているか、すでに使われています。お手数ですが、もう一度再設定メールを送ってください。（新規登録の確認メールの場合は、そのままログインをお試しください）'
        : 'メールのリンクの有効期限が切れているか、すでに使われています。そのままログインをお試しください。');
      return;
    }
    if (isRecovery) {
      recoveryEmail = session.user?.email ?? '';
      setView('reset');
      if (recoveryEmail) document.getElementById('reset-lead').textContent =
        `${recoveryEmail} の新しいパスワードを決めてください（${MIN_PASSWORD_LENGTH}文字以上）。ご自分のメールアドレスでない場合は、何もせずにこの画面を閉じてください。`;
      document.getElementById('new-password').focus();
      return;
    }
    // 新規登録の確認：確認だけ済ませて、ふだんどおりログインしてもらう
    const email = session.user?.email ?? '';
    try { await _sb.auth.signOut({ scope: 'local' }); } catch { /* 無視 */ }
    if (email) document.getElementById('email').value = email;
    showInfo('メールアドレスの確認が完了しました。登録したメールアドレスとパスワードでログインしてください。');
    document.getElementById('password').focus();
  };

  document.getElementById('to-forgot').addEventListener('click', () => {
    clearMessages();
    document.getElementById('forgot-email').value = document.getElementById('email').value.trim();
    setView('forgot');
    document.getElementById('forgot-email').focus();
  });
  document.querySelectorAll('.to-login').forEach(b => b.addEventListener('click', () => { clearMessages(); setView('login'); }));

  btn.addEventListener('click', doLogin);
  forgotBtn.addEventListener('click', doForgot);
  resetBtn.addEventListener('click', doReset);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (currentView === 'login') doLogin();
    else if (currentView === 'forgot') doForgot();
    else if (currentView === 'reset') doReset();
  });
  handleAuthLink();
});
</script>
</body>
</html>
