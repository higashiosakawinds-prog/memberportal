<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不具合・要望 — 東大阪吹奏楽団</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── 種類選択ボタン ── */
    .kind-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-3); margin-bottom:var(--space-6); }
    .kind-btn {
      display:flex; flex-direction:column; align-items:center; gap:var(--space-2);
      padding:var(--space-5) var(--space-3); border:2px solid var(--gray-200);
      border-radius:var(--radius-lg); background:var(--white); cursor:pointer;
      transition:all var(--transition-fast); text-align:center;
    }
    .kind-btn:hover { border-color:var(--navy-400); background:var(--gray-100); }
    .kind-btn.active { border-color:var(--gold-500); background:rgba(201,168,76,.08); box-shadow:var(--shadow-sm); }
    .kind-btn__emoji { font-size:28px; line-height:1; }
    .kind-btn__label { font-size:var(--text-sm); font-weight:700; color:var(--navy-800); }
    .kind-btn__sub   { font-size:11px; color:var(--gray-500); }

    .auto-info {
      margin-top:var(--space-4); padding:var(--space-3) var(--space-4);
      background:var(--gray-100); border-radius:var(--radius-md);
      font-size:var(--text-xs); color:var(--gray-500); line-height:1.8;
    }
    .auto-info b { color:var(--gray-700); font-weight:600; }

    .fb-history-card {
      border:1px solid var(--gray-200); border-radius:var(--radius-md);
      padding:var(--space-4); margin-bottom:var(--space-3); background:var(--white);
    }

    @media(max-width:520px){
      .kind-grid { grid-template-columns:1fr; }
      .kind-btn { flex-direction:row; justify-content:flex-start; text-align:left; padding:var(--space-4); }
    }
  </style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <div class="page-header fade-in">
      <div>
        <p class="page-header__eyebrow">SUPPORT</p>
        <h1 class="page-header__title">不具合・要望</h1>
      </div>
    </div>

    <div class="card mb-6 fade-in fade-in-1">
      <div class="card__header"><span class="card__title">アプリについて報告する</span></div>
      <div class="card__body">

        <!-- ① 種類 -->
        <label class="form-label">① 種類をえらぶ <span class="required">*</span></label>
        <div class="kind-grid" id="kind-grid">
          <button type="button" class="kind-btn active" data-kind="bug">
            <span class="kind-btn__emoji">✖</span>
            <span class="kind-btn__label">うまく動かない</span>
            <span class="kind-btn__sub">不具合・エラー</span>
          </button>
          <button type="button" class="kind-btn" data-kind="feature">
            <span class="kind-btn__emoji">💡</span>
            <span class="kind-btn__label">こうなったら嬉しい</span>
            <span class="kind-btn__sub">機能の要望</span>
          </button>
          <button type="button" class="kind-btn" data-kind="question">
            <span class="kind-btn__emoji">❓</span>
            <span class="kind-btn__label">使い方がわからない</span>
            <span class="kind-btn__sub">質問・困りごと</span>
          </button>
        </div>

        <!-- ② 内容 -->
        <div class="form-group">
          <label class="form-label">② 内容 <span class="required">*</span></label>
          <textarea id="fb-body" class="form-control" rows="4"
            placeholder="例）団費のページで「支払をする」ボタンを押しても何も起きません／出席の人数が一覧でも見られると嬉しいです"
            style="resize:vertical;line-height:1.7;"></textarea>
        </div>

        <!-- 対象ページ（自動判定・変更可） -->
        <div class="form-group">
          <label class="form-label">どの画面についてですか？</label>
          <select id="fb-page" class="form-control" style="max-width:280px;"></select>
        </div>

        <!-- ③ スクリーンショット（任意） -->
        <div class="form-group">
          <label class="form-label">③ スクリーンショット（任意）</label>
          <input type="file" id="fb-screenshot" accept="image/*" class="form-control" style="padding:var(--space-2);">
          <p style="font-size:var(--text-xs);color:var(--gray-400);margin-top:4px;">不具合のときは、画面の写真があると直しやすくなります。</p>
        </div>

        <button class="btn btn-gold" id="btn-fb-submit">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
          送信する
        </button>

        <div class="auto-info" id="fb-auto-info"></div>
      </div>
    </div>

    <p style="font-size:var(--text-xs);font-weight:700;color:var(--gold-500);letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid var(--gray-200);padding-bottom:var(--space-2);margin-bottom:var(--space-4);">送信履歴・対応状況</p>
    <div id="fb-history"><p style="font-size:var(--text-sm);color:var(--gray-400);">読み込み中…</p></div>

  </main>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="../js/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script>
// ══════════════════════════════════════
//  不具合・要望 送信ページ
// ══════════════════════════════════════
let selectedKind = 'bug';

const KIND_LABEL = { bug:'うまく動かない', feature:'こうなったら嬉しい', question:'使い方がわからない' };
const KIND_BADGE = { bug:'badge-danger', feature:'badge-gold', question:'badge-navy' };
const STATUS_LABEL = {
  new:'受付', triaged:'確認済み', planned:'対応予定', doing:'対応中',
  done:'対応完了', declined:'見送り', duplicate:'重複',
};
const STATUS_BADGE = {
  new:'badge-warning', triaged:'badge-navy', planned:'badge-navy', doing:'badge-gold',
  done:'badge-success', declined:'badge-navy', duplicate:'badge-navy',
};

// ── 対象ページの選択肢（サイドバー = common.js の NAV_ITEMS を唯一の正とする） ──
//   サイドバーに出ているページ名とそろえるため、NAV_ITEMS から id と label を取得。
//   サイドバー下部（各種申請・設定・不具合）も末尾に加える。
let _pageLabelMap = null;
function pageLabelMap() {
  if (_pageLabelMap) return _pageLabelMap;
  const map = {};
  try {
    (typeof NAV_ITEMS !== 'undefined' ? NAV_ITEMS : []).forEach(sec =>
      (sec.items || []).forEach(it => { map[it.id] = it.label; }));
  } catch { /* NAV_ITEMS 未読込時は空のまま */ }
  // サイドバー下部の固定リンク
  map.applications = map.applications || '各種申請';
  map.feedback     = map.feedback     || '不具合・要望';
  map.settings     = map.settings     || '設定';
  _pageLabelMap = map;
  return map;
}
function pageLabelOf(id) {
  if (!id) return '';
  return pageLabelMap()[id] ?? id;
}
function pageChoices() {
  const ids = [];
  try {
    (typeof NAV_ITEMS !== 'undefined' ? NAV_ITEMS : []).forEach(sec =>
      (sec.items || []).forEach(it => { if (!ids.includes(it.id)) ids.push(it.id); }));
  } catch {}
  ['applications', 'feedback', 'settings'].forEach(id => { if (!ids.includes(id)) ids.push(id); });
  return ids;
}

// 直前にいたページ（document.referrer）からページIDを推定
function detectReferrerPageId() {
  try {
    if (!document.referrer) return null;
    const u = new URL(document.referrer);
    if (u.origin !== location.origin) return null;
    const file = u.pathname.split('/').pop().replace('.html', '');
    if (file === 'index' || file === '') return 'dashboard';
    return file || null;
  } catch { return null; }
}

function isStandalone() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
         window.navigator.standalone === true;
}

// 直近のJSエラー（common.js が sessionStorage に蓄積したもの）を取得
function getRecentErrors() {
  try {
    const raw = sessionStorage.getItem('hs_error_log');
    const arr = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(arr) || !arr.length) return '';
    return arr.slice(-8).map(e =>
      `[${e.time ?? ''}] (${e.page ?? '-'}) ${e.msg ?? ''}${e.src ? ` @${e.src}:${e.line ?? ''}` : ''}`
    ).join('\n');
  } catch { return ''; }
}

// エラー発生時の通知バーなどから ?kind=bug&page=xxx で開かれたとき、種類と対象画面を自動セット
function applyUrlParams() {
  try {
    const p = new URLSearchParams(location.search);
    const kind = p.get('kind');
    if (kind && ['bug', 'feature', 'question'].includes(kind)) {
      selectedKind = kind;
      document.querySelectorAll('.kind-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.kind === kind));
    }
    const page = p.get('page');
    if (page) {
      const sel = document.getElementById('fb-page');
      if (sel && [...sel.options].some(o => o.value === page)) sel.value = page;
    }
  } catch { /* パラメータ不正時は無視 */ }
}

function initKindButtons() {
  document.querySelectorAll('.kind-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.kind-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedKind = btn.dataset.kind;
      renderAutoInfo();
    });
  });
}

function initPageSelect() {
  const sel = document.getElementById('fb-page');
  const detected = detectReferrerPageId();
  const ids = pageChoices();
  const opts = ['<option value="">（特定のページではない / わからない）</option>'];
  ids.forEach(id => opts.push(`<option value="${id}">${escHtml(pageLabelOf(id))}</option>`));
  sel.innerHTML = opts.join('');
  if (detected && ids.includes(detected)) sel.value = detected;
}

function renderAutoInfo() {
  const el = document.getElementById('fb-auto-info');
  if (!el) return;
  const bits = [
    `<b>自動で記録される情報</b>：この報告には、端末の種類・アプリのバージョン・ホーム画面アプリかどうかが自動で付きます。`,
  ];
  if (selectedKind === 'bug') {
    const errs = getRecentErrors();
    bits.push(errs
      ? `直近のエラー記録（${errs.split('\n').length}件）も一緒に送られます。`
      : `※ 直近のエラー記録は見つかりませんでした。`);
  }
  el.innerHTML = bits.join('<br>');
}

async function uploadScreenshot(user) {
  const input = document.getElementById('fb-screenshot');
  const file = input?.files?.[0];
  if (!file) return null;
  if (!_sb) return null;
  const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
  const path = `${user.id}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await _sb.storage.from('feedback').upload(path, file, {
    cacheControl: '3600', upsert: false, contentType: file.type || 'image/png',
  });
  if (error) { console.warn('[HighasuiDX] スクショアップロード失敗:', error.message); return null; }
  return path;
}

async function submitFeedback() {
  const body = document.getElementById('fb-body').value.trim();
  if (!body) { showToast('内容を入力してください', 'error'); return; }
  const user = getSessionUser();
  if (!_sb || !user) { showToast('ログインが必要です', 'error'); return; }

  const btn = document.getElementById('btn-fb-submit');
  btn.disabled = true; btn.textContent = '送信中…';

  // スクリーンショット（任意）
  const screenshotPath = await uploadScreenshot(user);

  const payload = {
    member_id:   user.id,
    member_name: user.name ?? '—',
    kind:        selectedKind,
    body,
    page:        document.getElementById('fb-page').value || null,
    screenshot_path: screenshotPath,
    user_agent:  navigator.userAgent,
    app_version: (typeof APP_VERSION !== 'undefined') ? APP_VERSION : null,
    is_pwa:      isStandalone(),
    console_log: selectedKind === 'bug' ? (getRecentErrors() || null) : null,
    status:      'new',
  };

  const { error } = await _sb.from('feedback').insert(payload);

  btn.disabled = false;
  btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg> 送信する';

  if (error) { showToast('送信に失敗しました: ' + error.message, 'error'); return; }

  document.getElementById('fb-body').value = '';
  document.getElementById('fb-screenshot').value = '';
  showToast('送信しました。ありがとうございます！', 'success');
  renderHistory(await loadMyFeedback());
}

async function loadMyFeedback() {
  const user = getSessionUser();
  if (!_sb || !user) return [];
  const { data, error } = await _sb.from('feedback')
    .select('*').eq('member_id', user.id)
    .order('created_at', { ascending: false });
  if (error) { console.warn('[HighasuiDX] 報告履歴取得失敗:', error.message); return []; }
  return data ?? [];
}

function renderHistory(list) {
  const el = document.getElementById('fb-history');
  if (!el) return;
  if (!list.length) {
    el.innerHTML = `<p style="font-size:var(--text-sm);color:var(--gray-400);">まだ報告はありません。</p>`;
    return;
  }
  el.innerHTML = list.map(f => `
    <div class="fb-history-card">
      <div style="display:flex;justify-content:space-between;gap:var(--space-2);align-items:center;margin-bottom:var(--space-2);flex-wrap:wrap;">
        <span>
          <span class="badge ${KIND_BADGE[f.kind] ?? 'badge-navy'}" style="font-size:10px;">${escHtml(KIND_LABEL[f.kind] ?? f.kind)}</span>
          ${f.page ? `<span style="font-size:var(--text-xs);color:var(--gray-400);margin-left:6px;">${escHtml(pageLabelOf(f.page))}</span>` : ''}
        </span>
        <span class="badge ${STATUS_BADGE[f.status] ?? 'badge-navy'}" style="font-size:10px;">${escHtml(STATUS_LABEL[f.status] ?? f.status)}</span>
      </div>
      <p style="font-size:var(--text-sm);color:var(--gray-700);white-space:pre-wrap;">${escHtml(f.body)}</p>
      <p style="font-size:11px;color:var(--gray-400);margin-top:var(--space-2);">${escHtml(new Date(f.created_at).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}))}</p>
      ${f.admin_note ? `<div style="margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--gray-200);"><p style="font-size:var(--text-xs);color:var(--gray-500);margin-bottom:4px;">担当からの返信</p><p style="font-size:var(--text-sm);color:var(--navy-800);white-space:pre-wrap;">${escHtml(f.admin_note)}</p></div>` : ''}
    </div>`).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
  initKindButtons();
  initPageSelect();
  applyUrlParams();
  renderAutoInfo();
  document.getElementById('btn-fb-submit').addEventListener('click', () => Net.lock('fb-submit', submitFeedback));
  renderHistory(await loadMyFeedback());
});
</script>
</body>
</html>
