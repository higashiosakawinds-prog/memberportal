<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>見学者対応 — 東大阪吹奏楽団</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── 統計カード（コンパクト） ── */
    .vr-stats { display:grid; grid-template-columns:repeat(6,1fr); gap:var(--space-3); margin-bottom:var(--space-6); }
    .vr-stat {
      background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg);
      padding:var(--space-4); cursor:pointer; transition:all var(--transition-fast);
    }
    .vr-stat:hover { border-color:var(--navy-500); box-shadow:var(--shadow-sm); }
    .vr-stat.active { border-color:var(--navy-800); background:rgba(19,34,56,0.04); }
    .vr-stat__num { font-family:var(--font-numeric); font-size:var(--text-2xl); font-weight:700; color:var(--navy-800); line-height:1; }
    .vr-stat__label { font-size:var(--text-xs); color:var(--gray-500); margin-top:4px; }

    /* ── ツールバー ── */
    .vr-toolbar { display:flex; gap:var(--space-3); flex-wrap:wrap; margin-bottom:var(--space-5); align-items:center; }
    .vr-toolbar #search-input { flex:1; min-width:200px; }
    .vr-sort-wrap { display:flex; align-items:center; gap:var(--space-2); }
    .vr-sort-label { font-size:var(--text-xs); color:var(--gray-500); white-space:nowrap; }
    .vr-sort-wrap select { width:auto; min-width:180px; }

    /* ── 練習日ごとビュー ── */
    .vr-day-group { margin-bottom:var(--space-5); }
    .vr-day-head {
      display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap;
      padding:var(--space-3) var(--space-4); border-radius:var(--radius-md);
      background:var(--navy-800); color:var(--white); margin-bottom:var(--space-2);
    }
    .vr-day-head.is-past { background:var(--gray-300); color:var(--gray-700); }
    .vr-day-head__date { font-weight:700; font-size:var(--text-base); }
    .vr-day-head__meta { font-size:var(--text-xs); opacity:.85; }
    .vr-day-head__count { margin-left:auto; font-family:var(--font-numeric); font-weight:700; font-size:var(--text-sm);
      background:rgba(255,255,255,.18); padding:2px 10px; border-radius:var(--radius-full); }
    .vr-day-head.is-past .vr-day-head__count { background:rgba(0,0,0,.08); }
    .vr-day-empty { text-align:center; color:var(--gray-500); padding:var(--space-10); background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg); }

    /* ── 表示切替タブ（対応中 / アーカイブ） ── */
    .vr-viewmode-tabs { display:flex; gap:0; border-bottom:2px solid var(--gray-200); margin-bottom:var(--space-5); }
    .vr-viewmode-tab {
      padding:var(--space-2) var(--space-5); font-size:var(--text-sm); font-weight:500;
      color:var(--gray-500); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px;
      transition:all var(--transition-fast); background:none; border-top:none; border-left:none; border-right:none;
    }
    .vr-viewmode-tab:hover { color:var(--navy-700); }
    .vr-viewmode-tab.active { color:var(--navy-800); border-bottom-color:var(--gold-500); font-weight:700; }

    /* ── 一覧（メール風リスト） ── */
    .vr-list { display:flex; flex-direction:column; background:var(--white); border-radius:var(--radius-lg); border:1px solid var(--gray-200); overflow:hidden; }
    .vr-row {
      display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:var(--space-4);
      padding:var(--space-4) var(--space-5); border-bottom:1px solid var(--gray-200);
      cursor:pointer; transition:background var(--transition-fast);
    }
    .vr-row:last-child { border-bottom:none; }
    .vr-row:hover { background:var(--gray-100); }
    .vr-row__dot { width:8px; height:8px; border-radius:50%; background:var(--gold-500); flex-shrink:0; }
    .vr-row__dot.read { background:transparent; }
    .vr-row__main { min-width:0; }
    .vr-row__top { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; margin-bottom:3px; }
    .vr-row__name { font-weight:700; color:var(--navy-800); font-size:var(--text-base); }
    .vr-row__sub { font-size:var(--text-xs); color:var(--gray-500); }
    .vr-row__meta { display:flex; align-items:center; gap:var(--space-3); flex-shrink:0; }
    .vr-row__date { font-size:var(--text-xs); color:var(--gray-400); white-space:nowrap; min-width:64px; text-align:right; }
    .vr-row__assignee { font-size:var(--text-xs); color:var(--gray-500); white-space:nowrap; }

    .status-badge-new       { background:rgba(192,57,43,.12);  color:var(--danger); }
    .status-badge-contacted { background:rgba(230,126,34,.12); color:#ca6f1e; }
    .status-badge-scheduled { background:rgba(41,128,185,.12); color:#1a5276; }
    .status-badge-visited   { background:rgba(201,168,76,.18); color:#8a6f1e; }
    .status-badge-joined    { background:rgba(39,174,96,.12);  color:#1e8449; }
    .status-badge-declined  { background:var(--gray-200);      color:var(--gray-500); }

    /* ── PC専用ガード（スマホ表示時に出す案内） ── */
    .vr-device-block { display:none; padding:var(--space-16) var(--space-6); text-align:center; }
    .vr-device-block__icon  { font-size:46px; margin-bottom:var(--space-4); }
    .vr-device-block__title { font-size:var(--text-xl); font-weight:700; color:var(--navy-800); margin-bottom:var(--space-3); }
    .vr-device-block__text  { font-size:var(--text-sm); color:var(--gray-600); line-height:1.9; max-width:440px; margin:0 auto; }

    /* ── 要対応バナー（対応中ビューの先頭に常時表示） ── */
    .vr-action-banner {
      display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); flex-wrap:wrap;
      border-radius:var(--radius-lg); padding:var(--space-4) var(--space-5); margin-bottom:var(--space-5);
    }
    .vr-action-banner.has-action { background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.28); }
    .vr-action-banner.no-action  { background:rgba(39,174,96,.07);  border:1px solid rgba(39,174,96,.22); }
    .vr-action-banner__main  { display:flex; align-items:center; gap:var(--space-4); }
    .vr-action-banner__num   { font-family:var(--font-numeric); font-size:var(--text-2xl); font-weight:700; line-height:1; min-width:1.2ch; text-align:center; }
    .vr-action-banner.has-action .vr-action-banner__num { color:var(--danger); }
    .vr-action-banner.no-action  .vr-action-banner__num { color:#1e8449; }
    .vr-action-banner__label { font-size:var(--text-sm); font-weight:700; color:var(--navy-800); }
    .vr-action-banner__sub   { font-size:var(--text-xs); color:var(--gray-500); margin-top:2px; }

    /* ── 行の優先度アクセント（左端のカラーバー＋地色） ── */
    .vr-row { position:relative; }
    .vr-row::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:transparent; }
    .vr-row.is-action::before  { background:var(--danger); }
    .vr-row.is-action          { background:rgba(192,57,43,.04); }
    .vr-row.is-action:hover    { background:rgba(192,57,43,.08); }
    .vr-row.is-joined::before  { background:#27ae60; }
    .vr-row.is-resolved        { opacity:.6; }
    .vr-row__chip {
      display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:var(--radius-full);
      font-size:10px; font-weight:700; white-space:nowrap;
    }
    .vr-row__chip.chip-reply { background:rgba(41,128,185,.14); color:#1a5276; }
    .vr-row__chip.chip-new   { background:rgba(192,57,43,.12); color:var(--danger); }

    /* ── 詳細モーダル ── */
    #modal-detail .modal { max-width:640px; }
    .vr-dl { display:grid; grid-template-columns:110px 1fr; gap:var(--space-2) var(--space-4); font-size:var(--text-sm); }
    .vr-dl dt { color:var(--gray-500); }
    .vr-dl dd { color:var(--gray-800); font-weight:500; word-break:break-word; }

    .vr-quick-actions { display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-3); }

    .vr-status-group { display:flex; gap:var(--space-2); flex-wrap:wrap; }
    .vr-status-btn {
      padding:var(--space-2) var(--space-4); border-radius:var(--radius-full);
      font-size:var(--text-xs); font-weight:600; border:1px solid var(--gray-300);
      background:var(--white); color:var(--gray-600); cursor:pointer; transition:all var(--transition-fast);
    }
    .vr-status-btn:hover { border-color:var(--navy-500); }
    .vr-status-btn.is-selected { background:var(--navy-800); color:var(--gold-300); border-color:var(--navy-800); font-weight:700; }

    .vr-date-chip {
      display:inline-flex; align-items:center; gap:6px; padding:4px 12px;
      border-radius:var(--radius-full); font-size:var(--text-xs); font-weight:600;
      background:rgba(41,128,185,.1); color:#1a5276; border:1px solid rgba(41,128,185,.25); margin:2px;
    }

    .vr-visit-count { display:flex; align-items:center; gap:var(--space-3); }
    .vr-visit-count__num { font-family:var(--font-numeric); font-size:var(--text-xl); font-weight:700; color:var(--navy-800); min-width:1.5ch; text-align:center; }

    /* ── チャット（LINE風） ── */
    .vr-chat-wrap {
      background:var(--gray-100); border:1px solid var(--gray-200); border-radius:var(--radius-md);
      padding:var(--space-4); max-height:360px; overflow-y:auto; display:flex; flex-direction:column; gap:var(--space-3);
    }
    .vr-chat-empty { text-align:center; color:var(--gray-400); font-size:var(--text-sm); padding:var(--space-6) 0; }
    .vr-bubble-row { display:flex; flex-direction:column; max-width:82%; }
    .vr-bubble-row.outbound { align-self:flex-end; align-items:flex-end; }
    .vr-bubble-row.inbound  { align-self:flex-start; align-items:flex-start; }
    .vr-bubble {
      padding:var(--space-3) var(--space-4); border-radius:var(--radius-lg); font-size:var(--text-sm);
      line-height:1.7; white-space:pre-wrap; word-break:break-word;
    }
    .vr-bubble-row.outbound .vr-bubble { background:var(--navy-800); color:var(--white); border-bottom-right-radius:4px; }
    .vr-bubble-row.inbound  .vr-bubble { background:var(--white); color:var(--gray-800); border:1px solid var(--gray-200); border-bottom-left-radius:4px; }
    .vr-bubble-meta { font-size:10px; color:var(--gray-400); margin-top:3px; padding:0 4px; }
    .vr-bubble-subject { font-size:10px; color:var(--gray-400); margin-bottom:2px; padding:0 4px; }

    .vr-compose { margin-top:var(--space-3); display:flex; flex-direction:column; gap:var(--space-2); }
    .vr-compose textarea { resize:vertical; min-height:70px; }
    .vr-compose-row { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); }
    .vr-thread-hint { font-size:var(--text-xs); color:var(--gray-500); }

    @media(max-width:768px){
      .vr-stats { grid-template-columns:repeat(3,1fr); }
      .vr-row { grid-template-columns:10px 1fr; }
      .vr-row__meta { grid-column:2/3; justify-content:space-between; margin-top:4px; }
      .vr-toolbar { flex-direction:column; align-items:stretch; }
      .vr-dl { grid-template-columns:90px 1fr; }
    }
  </style>
</head>
<body>

<header class="site-header" id="site-header"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main-content">

    <div class="page-header fade-in">
      <div>
        <p class="page-header__eyebrow">COMMUNICATION</p>
        <h1 class="page-header__title">見学者対応</h1>
      </div>
    </div>

    <!-- 権限なしメッセージ（JSで表示切替） -->
    <div id="no-permission" style="display:none;padding:var(--space-16);text-align:center;">
      <p style="font-size:var(--text-lg);font-weight:700;color:var(--danger);">このページにはアクセス権限がありません。</p>
      <a href="../index.html" class="btn btn-outline" style="margin-top:var(--space-6);">ダッシュボードに戻る</a>
    </div>

    <!-- スマホ向け案内（PC専用・JSで表示切替） -->
    <div id="no-device" class="vr-device-block">
      <div class="vr-device-block__icon">🖥️</div>
      <p class="vr-device-block__title">見学者対応はパソコン専用です</p>
      <p class="vr-device-block__text">
        見学者へのメール送信を安定して行うため、この画面はパソコンからのみ操作できます。<br>
        スマートフォンでは、回線が不安定なときに「送信したのにエラーになる」「二重送信される」といった不具合が起きやすいためです。<br><br>
        お手数ですが、パソコンのブラウザから開いてご利用ください。
      </p>
      <a href="../index.html" class="btn btn-outline" style="margin-top:var(--space-6);">ダッシュボードに戻る</a>
    </div>

    <div id="vr-app" style="display:none;">

      <!-- 表示切替（対応中 / アーカイブ） -->
      <div class="vr-viewmode-tabs fade-in fade-in-1" id="vr-viewmode-tabs"></div>

      <!-- 要対応バナー（JSで内容・表示切替） -->
      <div class="vr-action-banner no-action fade-in fade-in-1" id="vr-action-banner" style="display:none;"></div>

      <!-- 集計カード（フィルタ兼用） -->
      <div class="vr-stats fade-in fade-in-1" id="vr-stats"></div>

      <!-- ツールバー -->
      <div class="vr-toolbar fade-in fade-in-2" id="vr-toolbar">
        <input type="text" id="search-input" class="form-control" placeholder="名前・メール・電話番号で検索…">
        <div class="vr-sort-wrap" id="vr-sort-wrap">
          <label for="sort-select" class="vr-sort-label">並べ替え</label>
          <select id="sort-select" class="form-control">
            <option value="recommended">おすすめ（要対応を優先）</option>
            <option value="visit_asc">見学日が近い順</option>
            <option value="contact_desc">連絡が新しい順</option>
            <option value="contact_asc">連絡が古い順</option>
          </select>
        </div>
        <button class="btn btn-gold btn-sm" id="btn-register">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          見学者を登録
        </button>
        <button class="btn btn-outline btn-sm" id="btn-reload">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          更新
        </button>
      </div>

      <!-- 一覧 -->
      <div class="vr-list fade-in fade-in-3" id="vr-list">
        <div style="text-align:center;padding:var(--space-10);">
          <div class="loading-spinner" style="margin:0 auto;"></div>
        </div>
      </div>

    </div>

  </main>
</div>

<!-- ══ 詳細モーダル ══ -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title" id="detail-title">見学者詳細</h2>
      <button class="modal__close" onclick="closeVisitorDetailModal()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal__body" id="detail-body">読み込み中…</div>
    <div class="modal__footer" style="justify-content:space-between;flex-wrap:wrap;gap:var(--space-2);">
      <div style="display:flex;align-items:center;gap:var(--space-3);">
        <span id="detail-updated-hint" style="font-size:var(--text-xs);color:var(--gray-400);"></span>
        <button class="btn btn-sm btn-outline" id="btn-toggle-archive" onclick="toggleArchiveVisitor()"></button>
      </div>
      <div style="display:flex;gap:var(--space-3);">
        <button class="btn btn-outline" onclick="closeVisitorDetailModal()">閉じる</button>
        <button class="btn btn-gold" id="btn-save-detail">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
          変更を保存
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ══ 見学者 手動登録モーダル ══ -->
<div class="modal-overlay" id="modal-register">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title">見学者を登録</h2>
      <button class="modal__close" onclick="closeModal('modal-register')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal__body" id="register-body"></div>
    <div class="modal__footer" style="justify-content:flex-end;gap:var(--space-3);">
      <button class="btn btn-outline" onclick="closeModal('modal-register')">キャンセル</button>
      <button class="btn btn-gold" id="btn-register-save" onclick="submitRegister()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        この内容で登録
      </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="../js/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script>
// ══════════════════════════════════════
//  定数
// ══════════════════════════════════════
const STATUS_DEFS = [
  { key:'new',       label:'新規',           css:'status-badge-new' },
  { key:'contacted', label:'連絡済み・日程調整中', css:'status-badge-contacted' },
  { key:'scheduled', label:'見学予定',       css:'status-badge-scheduled' },
  { key:'visited',   label:'見学済み',       css:'status-badge-visited' },
  { key:'joined',    label:'入団',           css:'status-badge-joined' },
  { key:'declined',  label:'見送り・辞退',   css:'status-badge-declined' },
];
const STATUS_MAP = Object.fromEntries(STATUS_DEFS.map(s => [s.key, s]));

const PART_LABELS = {
  piccolo:'Piccolo', flute:'Flute', oboe:'Oboe', clarinet:'Clarinet', bassclarinet:'Bass Clarinet',
  bassoon:'Bassoon', ssaxophone:'Soprano Sax', asaxophone:'Alto Sax', tsaxophone:'Tenor Sax',
  bsaxophone:'Baritone Sax', horn:'Horn', trumpet:'Trumpet', trombone:'Trombone',
  euphonium:'Euphonium', tuba:'Tuba', percussion:'Percussion', contrabass:'Contrabass',
  piano:'Piano', staff:'スタッフ', other:'その他', undecided:'未定・相談したい',
};

// 見学者対応の担当になれるロール（common.js の ROLE_PERMISSIONS に合わせてここでも判定に使用）
const VISITOR_MANAGER_ROLES = ['gm','leader','subleader'];

// メール送信用 Apps Script Webアプリ URL（visitor-gmail-sync.gs をデプロイして取得したURLに置き換える）
const isVisitorGasOk = () => VISITOR_SEND_GAS_URL && !VISITOR_SEND_GAS_URL.includes('YOUR_VISITOR_GAS_SCRIPT_ID');

// ══════════════════════════════════════
//  状態
// ══════════════════════════════════════
let allRequests   = [];
let activitiesMap = {};   // { activityId: activityRow }
let practicesByDate = {}; // { 'YYYY-MM-DD': activityRow }（練習のみ／日付から練習を引く用）
let staffMembers  = [];   // 担当者候補
let activeFilter  = 'all';
let viewMode      = 'active'; // 'active' = 対応中 / 'archived' = アーカイブ / 'byday' = 練習日ごと
let sortMode      = 'recommended'; // 一覧の並べ替え（recommended / visit_asc / contact_desc / contact_asc）
let currentDetail = null; // 編集中のレコード（ローカルコピー）
let currentMessages = [];  // 開いている見学者のチャット履歴
let chatPollTimer = null;  // モーダルを開いている間の自動更新タイマー

// ══════════════════════════════════════
//  ユーティリティ
// ══════════════════════════════════════

function fmtDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function fmtRelative(iso) {
  if (!iso) return '—';
  const diffMs = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diffMs / 86400000);
  if (days <= 0) return '本日';
  if (days === 1) return '昨日';
  if (days < 7)  return `${days}日前`;
  return new Date(iso).toLocaleDateString('ja-JP', { month:'numeric', day:'numeric' });
}
function fmtActivityDate(a) {
  if (!a) return '（削除された日程）';
  const d = new Date(a.activity_date + 'T00:00:00');
  const W = ['日','月','火','水','木','金','土'];
  const t = a.start_time ? ` ${a.start_time.slice(0,5)}〜` : '';
  return `${d.getMonth()+1}/${d.getDate()}(${W[d.getDay()]})${t}`;
}
// 'YYYY-MM-DD' を「M/D(曜)」に整形（確定見学日の表示用）
function fmtYmd(ymd) {
  if (!ymd) return '—';
  const d = new Date(ymd + 'T00:00:00');
  if (isNaN(d)) return ymd;
  const W = ['日','月','火','水','木','金','土'];
  return `${d.getMonth()+1}/${d.getDate()}(${W[d.getDay()]})`;
}
const todayYmd = () => new Date().toLocaleDateString('sv-SE'); // 'YYYY-MM-DD'（ローカル日付）

// 今後の練習日を <option> 群にする（確定見学日の「練習日から選ぶ」補助。selected は選択中の日付）
function upcomingPracticeOptions(selected) {
  const t = todayYmd();
  const list = Object.values(activitiesMap)
    .filter(a => a.activity_type === 'practice' && !a.is_cancelled && a.activity_date >= t)
    .sort((a, b) => a.activity_date.localeCompare(b.activity_date));
  return ['<option value="">練習日から選ぶ…</option>']
    .concat(list.map(a => {
      const t2 = a.start_time ? ` ${a.start_time.slice(0,5)}〜` : '';
      const loc = a.location ? `　${a.location}` : '';
      return `<option value="${a.activity_date}" ${a.activity_date === selected ? 'selected' : ''}>${escHtml(fmtYmd(a.activity_date) + t2 + loc)}</option>`;
    })).join('');
}

function canManageVisitors() {
  const user = getSessionUser();
  if (!user) return false;
  const roles = Array.isArray(user.roles) ? user.roles : [user.role].filter(Boolean);
  return roles.some(r => VISITOR_MANAGER_ROLES.includes(r));
}

// 「要対応」＝対応中かつ（新規・未対応／相手から新着返信あり）。一覧の優先表示とバナー集計に使う
function needsAction(r) {
  return !r.archived && (r.status === 'new' || r.has_unread_reply);
}

// スマホ判定（PC専用ガード用）。スマホのUA、または「タッチ操作＋短辺が狭い端末」をスマホとみなす。
// タブレット・PC（マウス操作／大画面）はブロックしない。読み込み時に一度だけ判定する。
function isPhoneDevice() {
  const ua = navigator.userAgent || '';
  const uaPhone = /iPhone|iPod|Android.+Mobile|Windows Phone|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  const coarse  = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const narrow  = Math.min(window.innerWidth, window.innerHeight) < 768;
  return uaPhone || (coarse && narrow);
}

// ══════════════════════════════════════
//  データ読み込み
// ══════════════════════════════════════
async function loadAll() {
  if (!_sb) { showToast('Supabase未接続です', 'error'); return; }

  const [reqRes, actRes, memRes] = await Promise.all([
    _sb.from('visit_requests').select('*').order('created_at', { ascending: false }),
    _sb.from('activities').select('id, activity_date, start_time, end_time, location, activity_type, is_cancelled'),
    _sb.from('profiles').select('id, last_name, first_name, roles'),
  ]);

  if (reqRes.error) {
    document.getElementById('vr-list').innerHTML =
      `<div style="text-align:center;padding:var(--space-10);color:var(--danger);">データの取得に失敗しました：${escHtml(reqRes.error.message)}</div>`;
    return;
  }

  allRequests = reqRes.data ?? [];
  activitiesMap = {};
  practicesByDate = {};
  (actRes.data ?? []).forEach(a => {
    activitiesMap[a.id] = a;
    if (a.activity_type === 'practice' && !a.is_cancelled) practicesByDate[a.activity_date] = a;
  });
  staffMembers = (memRes.data ?? []).filter(m => {
    const roles = Array.isArray(m.roles) ? m.roles : [];
    return roles.some(r => VISITOR_MANAGER_ROLES.includes(r));
  });

  renderViewModeTabs();
  renderStats();
  renderList();
}

// ══════════════════════════════════════
//  表示切替タブ（対応中 / アーカイブ）
// ══════════════════════════════════════
function renderViewModeTabs() {
  const archivedCount = allRequests.filter(r => r.archived).length;
  const tabs = [
    { key:'active',   label:'対応中' },
    { key:'byday',    label:'練習日ごと' },
    { key:'archived', label:`アーカイブ${archivedCount ? `（${archivedCount}）` : ''}` },
  ];
  document.getElementById('vr-viewmode-tabs').innerHTML = tabs.map(t => `
    <button class="vr-viewmode-tab ${viewMode === t.key ? 'active' : ''}" onclick="setViewMode('${t.key}')">${escHtml(t.label)}</button>`).join('');
}

function setViewMode(mode) {
  viewMode = mode;
  activeFilter = 'all';
  renderViewModeTabs();
  renderStats();
  renderList();
}

function renderStats() {
  const statsEl = document.getElementById('vr-stats');
  const toolbarEl = document.getElementById('vr-toolbar');
  const sortWrap = document.getElementById('vr-sort-wrap');
  // 練習日ごとビューでは集計カード・要対応バナー・並べ替えは使わないので隠す
  if (viewMode === 'byday') {
    statsEl.style.display = 'none';
    document.getElementById('vr-action-banner').style.display = 'none';
    if (sortWrap) sortWrap.style.display = 'none';
    if (toolbarEl) toolbarEl.style.display = 'flex';
    return;
  }
  statsEl.style.display = 'grid';
  if (sortWrap) sortWrap.style.display = 'flex';

  const scoped = allRequests.filter(r => !!r.archived === (viewMode === 'archived'));
  const counts = { all: scoped.length };
  STATUS_DEFS.forEach(s => { counts[s.key] = scoped.filter(r => r.status === s.key).length; });

  const cards = [
    { key:'all', label:'すべて' },
    { key:'new', label:'新規' },
    { key:'contacted', label:'連絡済み・調整中' },
    { key:'scheduled', label:'見学予定' },
    { key:'visited', label:'見学済み' },
    { key:'joined', label:'入団' },
  ];

  document.getElementById('vr-stats').innerHTML = cards.map(c => `
    <div class="vr-stat ${activeFilter === c.key ? 'active' : ''}" onclick="setFilter('${c.key}')">
      <p class="vr-stat__num">${counts[c.key] ?? 0}</p>
      <p class="vr-stat__label">${escHtml(c.label)}</p>
    </div>`).join('');

  // 要対応バナー（対応中ビューのときだけ、新規＋新着返信の件数を目立たせる）
  const actionCount = scoped.filter(needsAction).length;
  const newCount    = scoped.filter(r => r.status === 'new').length;
  const replyCount  = scoped.filter(r => r.has_unread_reply).length;
  renderActionBanner(actionCount, newCount, replyCount);
}

// 「要対応 N件」バナーを描画。0件のときは達成感のある表示に切り替える。
function renderActionBanner(total, newC, replyC) {
  const el = document.getElementById('vr-action-banner');
  if (!el) return;
  if (viewMode === 'archived') { el.style.display = 'none'; return; }
  el.style.display = 'flex';

  if (total > 0) {
    const filtering = activeFilter === 'action';
    el.className = 'vr-action-banner has-action fade-in';
    el.innerHTML = `
      <div class="vr-action-banner__main">
        <span class="vr-action-banner__num">${total}</span>
        <div>
          <p class="vr-action-banner__label">要対応の見学者がいます</p>
          <p class="vr-action-banner__sub">🆕 新規・未対応 ${newC}件　／　🔵 新着返信 ${replyC}件</p>
        </div>
      </div>
      <button class="btn btn-sm ${filtering ? 'btn-gold' : 'btn-outline'}" onclick="setFilter('${filtering ? 'all' : 'action'}')">
        ${filtering ? 'すべて表示' : '要対応だけ表示'}
      </button>`;
  } else {
    el.className = 'vr-action-banner no-action fade-in';
    el.innerHTML = `
      <div class="vr-action-banner__main">
        <span class="vr-action-banner__num">0</span>
        <p class="vr-action-banner__label" style="font-weight:600;color:var(--gray-600);">対応待ちはありません 🎉</p>
      </div>`;
  }
}

function setFilter(key) {
  activeFilter = key;
  renderStats();
  renderList();
}

// ══════════════════════════════════════
//  一覧描画
// ══════════════════════════════════════
function renderList() {
  // 練習日ごとビューは別描画
  if (viewMode === 'byday') { renderByDay(); return; }

  const kw = document.getElementById('search-input').value.trim().toLowerCase();

  const filtered = allRequests.filter(r => {
    if (!!r.archived !== (viewMode === 'archived')) return false;
    if (activeFilter === 'action') { if (!needsAction(r)) return false; }
    else if (activeFilter !== 'all' && r.status !== activeFilter) return false;
    if (kw) {
      const text = `${r.name}${r.yomi ?? ''}${r.email}${r.phone ?? ''}`.toLowerCase();
      if (!text.includes(kw)) return false;
    }
    return true;
  });

  sortRequests(filtered);

  const listEl = document.getElementById('vr-list');
  listEl.className = 'vr-list'; // 練習日ごとビューで外した囲みを戻す
  if (!filtered.length) {
    const emptyMsg = viewMode === 'archived'
      ? 'アーカイブ済みの見学申込はありません。'
      : (activeFilter === 'action' ? '要対応の見学者はいません。' : '該当する見学申込はありません。');
    listEl.innerHTML = `<div style="text-align:center;padding:var(--space-10);color:var(--gray-500);">${emptyMsg}</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(rowHtml).join('');
}

// 並べ替え（sortMode に従う）。recommended は従来の優先度順。
function sortRequests(arr) {
  const priority = r => needsAction(r) ? 0 : (r.status === 'joined' || r.status === 'declined' ? 2 : 1);
  if (sortMode === 'visit_asc') {
    // 見学日が近い順（未設定は末尾）。同日は連絡が古い順。
    arr.sort((a, b) => {
      const da = a.scheduled_visit_date || '', db = b.scheduled_visit_date || '';
      if (!!da !== !!db) return da ? -1 : 1;
      if (da !== db) return da.localeCompare(db);
      return new Date(a.created_at) - new Date(b.created_at);
    });
  } else if (sortMode === 'contact_desc') {
    arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  } else if (sortMode === 'contact_asc') {
    arr.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  } else {
    // recommended：①要対応（新着返信→新規の順・古い順）②対応中 ③入団・辞退は最後
    arr.sort((a, b) => {
      const pa = priority(a), pb = priority(b);
      if (pa !== pb) return pa - pb;
      if (pa === 0) {
        const ua = a.has_unread_reply ? 0 : 1, ub = b.has_unread_reply ? 0 : 1;
        if (ua !== ub) return ua - ub;
        return new Date(a.created_at) - new Date(b.created_at);
      }
      return new Date(b.created_at) - new Date(a.created_at);
    });
  }
}

// 1件ぶんの行HTML（一覧・練習日ごとビューで共用）
function rowHtml(r) {
  const status   = STATUS_MAP[r.status] ?? STATUS_MAP.new;
  const assignee = staffMembers.find(m => m.id === r.assigned_to);

  // 確定見学日があればそれを優先表示。なければ希望日程の要約。
  let dateLabel;
  if (r.scheduled_visit_date) {
    dateLabel = `🗓 見学日 ${fmtYmd(r.scheduled_visit_date)}`;
  } else {
    const dateIds  = r.date_request_activity_ids ?? [];
    const firstAct = dateIds.map(id => activitiesMap[id]).filter(Boolean).sort((a,b) => a.activity_date.localeCompare(b.activity_date))[0];
    const dateSummary = dateIds.length
      ? `${fmtActivityDate(firstAct)}${dateIds.length > 1 ? ` 他${dateIds.length - 1}件` : ''}`
      : (r.date_request_note ? '希望日程（自由記述あり）' : '希望日程未指定');
    dateLabel = `📅 希望 ${dateSummary}`;
  }

  const action   = needsAction(r);
  const rowCls   = action ? 'is-action'
                 : (r.status === 'joined' ? 'is-joined'
                 : (r.status === 'declined' ? 'is-resolved' : ''));

  const chip = r.has_unread_reply
    ? '<span class="vr-row__chip chip-reply">🔵 新着返信</span>'
    : (r.status === 'new' ? '<span class="vr-row__chip chip-new">🆕 新規・未対応</span>' : '');

  const contact = r.email ? `✉️ ${escHtml(r.email)}` : (r.source ? `📨 ${escHtml(r.source)}` : '');

  return `
    <div class="vr-row ${rowCls}" onclick="openDetail('${r.id}')">
      <span class="vr-row__dot ${action ? '' : 'read'}"></span>
      <div class="vr-row__main">
        <div class="vr-row__top">
          ${chip}
          <span class="vr-row__name">${escHtml(r.name)}</span>
          <span class="badge ${status.css}" style="font-size:10px;">${escHtml(status.label)}</span>
          ${r.member_type === 'minor' ? '<span class="badge badge-warning" style="font-size:10px;">未成年</span>' : ''}
          ${PART_LABELS[r.part] ? `<span class="badge badge-navy" style="font-size:10px;">${escHtml(PART_LABELS[r.part])}</span>` : ''}
        </div>
        <div class="vr-row__sub">${escHtml(dateLabel)}　${contact}</div>
      </div>
      <div class="vr-row__meta">
        <span class="vr-row__assignee">${assignee ? `👤 ${escHtml(assignee.last_name)}` : '未割当'}</span>
        <span class="vr-row__date">${escHtml(fmtRelative(r.created_at))}</span>
      </div>
    </div>`;
}

// ══════════════════════════════════════
//  練習日ごとの見学予定者一覧
// ══════════════════════════════════════
function renderByDay() {
  const kw = document.getElementById('search-input').value.trim().toLowerCase();
  const listEl = document.getElementById('vr-list');

  // アーカイブ以外＆確定見学日あり。キーワード検索も反映。
  const scoped = allRequests.filter(r => {
    if (r.archived || !r.scheduled_visit_date) return false;
    if (kw) {
      const text = `${r.name}${r.yomi ?? ''}${r.email ?? ''}${r.phone ?? ''}`.toLowerCase();
      if (!text.includes(kw)) return false;
    }
    return true;
  });

  if (!scoped.length) {
    listEl.innerHTML = `<div class="vr-day-empty">確定した見学日のある見学者はいません。<br>各見学者の詳細画面で「確定見学日」を設定すると、ここに練習日ごとに表示されます。</div>`;
    return;
  }

  // 日付でグループ化
  const groups = {};
  scoped.forEach(r => { (groups[r.scheduled_visit_date] ??= []).push(r); });

  const today = todayYmd();
  // 未来を先に（近い順）、過去は後ろに（新しい順）
  const dates = Object.keys(groups).sort((a, b) => {
    const fa = a >= today, fb = b >= today;
    if (fa !== fb) return fa ? -1 : 1;
    return fa ? a.localeCompare(b) : b.localeCompare(a);
  });

  listEl.className = ''; // リスト枠の囲みを外してグループ単位の表示にする
  listEl.innerHTML = dates.map(date => {
    const rows = groups[date];
    rows.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    const act = practicesByDate[date];
    const isPast = date < today;
    const meta = act
      ? `${act.start_time ? act.start_time.slice(0,5) + '〜' : ''}${act.end_time ? act.end_time.slice(0,5) : ''}${act.location ? '　' + escHtml(act.location) : ''}`
      : '（この日は練習予定なし — 単発の見学日）';

    return `
      <div class="vr-day-group">
        <div class="vr-day-head ${isPast ? 'is-past' : ''}">
          <span class="vr-day-head__date">🗓 ${escHtml(fmtYmd(date))}</span>
          <span class="vr-day-head__meta">${meta}</span>
          <span class="vr-day-head__count">見学 ${rows.length}名</span>
        </div>
        <div class="vr-list">${rows.map(rowHtml).join('')}</div>
      </div>`;
  }).join('');
}

//  チャット（メールのやりとり）

async function loadChatMessages(visitRequestId, opts = {}) {
  if (!_sb) return;
  const { data, error } = await _sb
    .from('visit_messages')
    .select('*')
    .eq('visit_request_id', visitRequestId)
    .order('sent_at', { ascending: true });

  if (error) {
    if (!opts.silent) document.getElementById('vr-chat-wrap').innerHTML =
      `<div class="vr-chat-empty">履歴の取得に失敗しました。</div>`;
    return;
  }

  // モーダルが別の見学者に切り替わっていたら描画しない
  if (!currentDetail || currentDetail.id !== visitRequestId) return;

  currentMessages = data ?? [];
  renderChat();
  updateSyncStatus();
}

// 直近のsynced_atを「最終同期」として表示（GmailAPI側の同期が実際に反映された時刻）
function updateSyncStatus() {
  const el = document.getElementById('vr-sync-status');
  if (!el) return;
  if (!currentMessages.length) {
    el.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:var(--gray-300);"></span> まだ同期履歴なし`;
    return;
  }
  const latestSynced = currentMessages.reduce((max, m) => {
    const t = m.synced_at ? new Date(m.synced_at).getTime() : 0;
    return t > max ? t : max;
  }, 0);
  const label = latestSynced
    ? new Date(latestSynced).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
    : '—';
  el.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:var(--success);"></span> Gmail同期済み・最終更新 ${escHtml(label)}`;
}

function renderChat() {
  const wrap = document.getElementById('vr-chat-wrap');
  if (!wrap) return;

  // 更新前に「一番下付近を見ていたか」を判定し、その場合だけ更新後も一番下へ追従する。
  // 上の方をスクロールして読んでいる最中は、自動更新でスクロール位置が動かないようにする。
  const wasNearBottom = (wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight) < 60;

  if (!currentMessages.length) {
    wrap.innerHTML = `<div class="vr-chat-empty">まだメールのやりとりはありません。下から最初のメッセージを送信できます。</div>`;
    return;
  }

  const fmt = iso => new Date(iso).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });

  wrap.innerHTML = currentMessages.map(m => `
    <div class="vr-bubble-row ${m.direction}">
      <div class="vr-bubble-subject">${escHtml(m.subject ?? '')}</div>
      <div class="vr-bubble">${escHtml(m.body ?? '')}</div>
      <div class="vr-bubble-meta">${m.direction === 'outbound' ? '自団' : '相手'}・${escHtml(fmt(m.sent_at))}</div>
    </div>`).join('');

  if (wasNearBottom) {
    wrap.scrollTop = wrap.scrollHeight;
  }
}

function updateArchiveButton() {

async function toggleArchiveVisitor() {
  if (!currentDetail) return;
  const nextArchived = !currentDetail.archived;
  const msg = nextArchived
    ? `「${currentDetail.name}」さんをアーカイブに移動しますか？\n一覧の「対応中」タブには表示されなくなります。`
    : `「${currentDetail.name}」さんをアーカイブから戻しますか？`;
  if (!confirm(msg)) return;

  const { error } = await _sb.from('visit_requests').update({ archived: nextArchived }).eq('id', currentDetail.id);
  if (error) { showToast('操作に失敗しました: ' + error.message, 'error'); return; }

  currentDetail.archived = nextArchived;
  const idx = allRequests.findIndex(x => x.id === currentDetail.id);
  if (idx !== -1) allRequests[idx].archived = nextArchived;

  updateArchiveButton();

  renderList();

// 今後3回の「練習」日程を取得し、返信本文のカーソル位置へ挿入する
async function insertUpcomingPractices() {
  if (!_sb) { showToast('Supabase未接続です', 'error'); return; }

  const today = new Date().toISOString().slice(0, 10);
  const { data, error } = await _sb
    .from('activities')
    .select('activity_date, start_time, end_time, location')
    .eq('activity_type', 'practice')
    .eq('is_cancelled', false)
    .gte('activity_date', today)
    .order('activity_date', { ascending: true })
    .limit(3);

  if (error) { showToast('練習日程の取得に失敗しました: ' + error.message, 'error'); return; }
  if (!data || !data.length) { showToast('今後の練習予定が登録されていません', 'error'); return; }

  const WD = ['日','月','火','水','木','金','土'];
  const lines = data.map(a => {
    const d = new Date(a.activity_date + 'T00:00:00');
    const timeStr = a.start_time ? ` ${a.start_time.slice(0,5)}〜${a.end_time ? a.end_time.slice(0,5) : ''}` : '';
    return `・${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）${timeStr}${a.location ? '　' + a.location : ''}`;
  });
  const block = `【今後の練習予定】\n${lines.join('\n')}`;

  insertAtCursor(document.getElementById('chat-compose-body'), block);
}

// テキストエリアのカーソル位置（未フォーカス時は末尾）にテキストを挿入する
function insertAtCursor(textarea, text) {
  const hasSelection = document.activeElement === textarea;
  const start = hasSelection ? textarea.selectionStart : textarea.value.length;
  const end   = hasSelection ? textarea.selectionEnd   : textarea.value.length;
  const before = textarea.value.slice(0, start);
  const after  = textarea.value.slice(end);
  const needsLeadingBreak = before.length > 0 && !before.endsWith('\n');
  const insertText = (needsLeadingBreak ? '\n' : '') + text + '\n';

  textarea.value = before + insertText + after;
  const newPos = (before + insertText).length;
  textarea.focus();
  textarea.setSelectionRange(newPos, newPos);
}

// ログイン中ユーザーの氏名・役職から署名を生成
function buildSenderSignature() {
  const user = getSessionUser();
  if (!user) return '';
  const roleKeys = Array.isArray(user.roles) ? user.roles : [user.role].filter(Boolean);
  const roleLabels = roleKeys
    .map(r => (typeof ROLE_DEFINITIONS !== 'undefined' ? ROLE_DEFINITIONS.find(d => d.value === r)?.label : null) ?? r)
    .filter(Boolean);
  const roleStr = roleLabels.length ? `（${roleLabels.join('・')}）` : '';
  return `\n\n──\n東大阪吹奏楽団　${user.name ?? ''}${roleStr}`;
}

// メール冒頭に入れる返信案内（件名変更なし・本文はこの行より上に書いてもらうよう依頼）
const REPLY_NOTICE = '※このメールにご返信いただく際は、件名を変更せず「返信」ボタンからそのままご返信ください。\n　（本文はこの区切り線より上にご記入ください）\n──────────────────────';

async function sendChatMessage() {
  if (!currentDetail) return;
  const textarea = document.getElementById('chat-compose-body');
  const rawBody = textarea.value.trim();
  if (!rawBody) { showToast('本文を入力してください', 'error'); return; }
  const body = `${REPLY_NOTICE}\n\n${rawBody}${buildSenderSignature()}`;

  if (!isVisitorGasOk()) {
    showToast('送信用GASのURLが未設定です（visitors.htmlのVISITOR_SEND_GAS_URL）', 'error');
    return;
  }

  const btn = document.getElementById('btn-chat-send');
  btn.disabled = true; btn.textContent = '送信中…';

  try {
    const json = await Net.gas(VISITOR_SEND_GAS_URL, {
      method: 'POST',
      timeout: 60000,
      body: {
        visitRequestId: currentDetail.id,
        to: currentDetail.email,
        subject: currentDetail.gmail_thread_id ? null : `${currentDetail.name}様の見学について`,
        body,
        threadId: currentDetail.gmail_thread_id || null,
      },
    });
    if (!json.ok) {
      // 応答が返らなかった場合（回線切断・タイムアウト等）は送信できたか不確実。
      // エラー扱いにせず、本文は残したまま数秒後に履歴を自動更新して結果を確認できるようにする。
      if (json.network) {
        showToast('通信が不安定で結果を確認できませんでした。数秒後に履歴を更新します。反映されていれば送信済みです（重複送信にご注意ください）', 'default');
        setTimeout(() => loadChatMessages(currentDetail.id, { silent: true }), 6000);
        return;
      }
      throw new Error(json.error || '送信に失敗しました');
    }


    // スレッドが新規作成された場合はローカル状態にも反映
    if (!currentDetail.gmail_thread_id) {
      currentDetail.gmail_thread_id = json.threadId;
      const idx = allRequests.findIndex(x => x.id === currentDetail.id);
      if (idx !== -1) allRequests[idx].gmail_thread_id = json.threadId;
      document.querySelector('.vr-thread-hint').textContent = '既存のやりとりに返信します';
    }

    // 即座に画面へ反映（次の自動更新を待たない）
    currentMessages.push({
      direction: 'outbound',
      subject: currentDetail.gmail_thread_id ? currentMessages[currentMessages.length-1]?.subject ?? '' : `${currentDetail.name}様の見学について`,
      body,
      sent_at: json.sentAt || new Date().toISOString(),
    });
    renderChat();
    textarea.value = '';
    showToast('送信しました', 'success');

  } catch (e) {
    showToast('送信に失敗しました: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg> 送信';
  }
}

async function submitRegister() {
  if (!_sb) { showToast('Supabase未接続です', 'error'); return; }
  const name = document.getElementById('reg-name').value.trim();
  if (!name) { showToast('お名前を入力してください', 'error'); return; }

  const payload = {
    name,
    yomi:                 document.getElementById('reg-yomi').value.trim() || null,
    source:               document.getElementById('reg-source').value || null,
    part:                 document.getElementById('reg-part').value || null,
    member_type:          document.getElementById('reg-member-type').value,
    email:                document.getElementById('reg-email').value.trim() || null,
    phone:                document.getElementById('reg-phone').value.trim() || null,
    line_id:              document.getElementById('reg-line').value.trim() || null,
    scheduled_visit_date: document.getElementById('reg-visit-date').value || null,
    status:               document.getElementById('reg-status').value,
    assigned_to:          document.getElementById('reg-assignee').value || null,
    internal_notes:       document.getElementById('reg-notes').value.trim() || null,
  };

  const btn = document.getElementById('btn-register-save');
  btn.disabled = true; btn.textContent = '登録中…';

  const { data, error } = await _sb.from('visit_requests').insert(payload).select().single();

  btn.disabled = false;
  btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg> この内容で登録';

  if (error) {
    const hint = /row-level security|permission|policy/i.test(error.message)
      ? '（登録権限のRLS設定が必要です。visit_requests_patch.sql を実行してください）'
      : '';
    showToast('登録に失敗しました: ' + error.message + hint, 'error');
    return;
  }

  allRequests.unshift(data);
  closeModal('modal-register');
  renderViewModeTabs();
  renderStats();
  renderList();
  showToast('見学者を登録しました', 'success');
}

// ══════════════════════════════════════
//  モーダル内でのテキストドラッグ選択時に誤って閉じないようにする
//  （common.js側の「オーバーレイをクリックしたら閉じる」処理は
//    オーバーレイ要素自身に登録されているため、同じ要素に後から
//    リスナーを足しても登録順の関係で先回りできない。
//    document のcaptureフェーズで捕まえて止めるのが確実。）
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const overlay = document.getElementById('modal-detail');
  if (!overlay) return;
  let downOnOverlay = false;

  overlay.addEventListener('mousedown', e => {
    downOnOverlay = (e.target === overlay);
  });

  document.addEventListener('click', e => {
    // モーダル内でドラッグを始めて外側でマウスを離すと、
    // clickイベントのtargetがoverlay自身になり誤って閉じてしまう。
    // mousedownがoverlay自身から始まっていない場合はこのクリックを握りつぶす。
    if (e.target === overlay && !downOnOverlay) {
      e.stopPropagation();
    }
    downOnOverlay = false;
  }, true); // document のcaptureフェーズ = common.js側のリスナーより確実に先に実行される
});

// ══════════════════════════════════════
//  保存
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-save-detail').addEventListener('click', async () => {
    if (!currentDetail || !_sb) return;

    const btn = document.getElementById('btn-save-detail');
    btn.disabled = true; btn.textContent = '保存中…';

    const payload = {
      status:               currentDetail.status,
      assigned_to:          document.getElementById('detail-assignee').value || null,
      visit_count:          parseInt(document.getElementById('detail-visit-count').textContent) || 0,
      internal_notes:       document.getElementById('detail-notes').value.trim() || null,
      scheduled_visit_date: document.getElementById('detail-visit-date').value || null,
    };

    const { error } = await _sb.from('visit_requests').update(payload).eq('id', currentDetail.id);

    btn.disabled = false; btn.textContent = '変更を保存';

    if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }

    const idx = allRequests.findIndex(x => x.id === currentDetail.id);
    if (idx !== -1) Object.assign(allRequests[idx], payload);

    showToast('保存しました', 'success');
    closeVisitorDetailModal();
    renderStats();
    renderList();
  });

  document.getElementById('search-input').addEventListener('input', renderList);
  document.getElementById('btn-reload').addEventListener('click', loadAll);
  document.getElementById('btn-register').addEventListener('click', openRegisterModal);
  document.getElementById('sort-select').addEventListener('change', e => {
    sortMode = e.target.value;
    renderList();
  });
});

// ══════════════════════════════════════
//  初期化
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  // PC専用ガード：スマホからは操作させず、案内だけ表示する
  if (isPhoneDevice()) {
    document.getElementById('no-device').style.display = 'block';
    return;
  }
  if (!canManageVisitors()) {
    document.getElementById('no-permission').style.display = 'block';
    return;
  }
  document.getElementById('vr-app').style.display = 'block';
  await loadAll();
});
</script>
</body>
</html>
