<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート管理 — 東大阪吹奏楽団</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .sa-tabs { display:flex;gap:0;border-bottom:2px solid var(--gray-200);margin-bottom:var(--space-8);flex-wrap:wrap; }
    .sa-tab {
      padding:var(--space-3) var(--space-5);font-size:var(--text-sm);font-weight:500;
      color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
      transition:all var(--transition-fast);background:none;border-top:none;border-left:none;border-right:none;
    }
    .sa-tab:hover { color:var(--navy-700); }
    .sa-tab.active { color:var(--navy-800);border-bottom-color:var(--gold-500);font-weight:700; }
    .sa-panel { display:none; }
    .sa-panel.active { display:block; }

    /* ── フォームビルダー ── */
    .qb { border:1px solid var(--gray-200); border-radius:var(--radius-lg); background:var(--white);
          border-left:4px solid var(--navy-600); padding:var(--space-5); margin-bottom:var(--space-4); }
    .qb__head { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); margin-bottom:var(--space-3); }
    .qb__num { font-size:var(--text-xs); font-weight:700; color:var(--gold-500); letter-spacing:.1em; }
    .qb__tools { display:flex; gap:4px; }
    .qb__tool {
      width:30px; height:30px; border:1px solid var(--gray-200); border-radius:var(--radius-sm); background:var(--white);
      display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--gray-500);
      transition:all var(--transition-fast);
    }
    .qb__tool:hover { background:var(--gray-100); color:var(--navy-700); }
    .qb__tool.danger:hover { background:rgba(192,57,43,.1); color:var(--danger); border-color:var(--danger); }
    .qb__tool:disabled { opacity:.35; cursor:not-allowed; }
    .qb__row { display:grid; grid-template-columns:1fr 240px; gap:var(--space-3); margin-bottom:var(--space-3); }
    .qb-opt { display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-2); }
    .qb-opt__mark { color:var(--gray-400); flex-shrink:0; width:16px; height:16px; }
    .qb-opt__del { cursor:pointer; color:var(--gray-400); flex-shrink:0; padding:4px; }
    .qb-opt__del:hover { color:var(--danger); }
    .qb-foot { display:flex; align-items:center; gap:var(--space-5); margin-top:var(--space-4); padding-top:var(--space-3); border-top:1px solid var(--gray-100); flex-wrap:wrap; }
    .qb-switch { display:flex; align-items:center; gap:var(--space-2); font-size:var(--text-sm); color:var(--gray-700); cursor:pointer; }
    .qb-scale-row { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }

    .cat-check-group { display:flex; flex-wrap:wrap; gap:var(--space-2); }
    .cat-check-item {
      display:flex; align-items:center; gap:6px; padding:var(--space-2) var(--space-3);
      border:1px solid var(--gray-300); border-radius:var(--radius-md); cursor:pointer; font-size:var(--text-sm);
    }
    .cat-check-item input { accent-color:var(--navy-600); }

    /* ── アンケート一覧カード ── */
    .survey-card {
      background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg);
      padding:var(--space-5); margin-bottom:var(--space-4);
    }
    .survey-card__title { font-size:var(--text-lg); font-weight:700; color:var(--navy-800); }
    .survey-card__desc { font-size:var(--text-sm); color:var(--gray-500); margin-top:4px; }
    .survey-card__meta { font-size:var(--text-xs); color:var(--gray-500); margin-top:6px; }
    .survey-card__progress-wrap { margin-top:var(--space-4); }
    .survey-progress-bar { height:8px; border-radius:var(--radius-full); background:var(--gray-200); overflow:hidden; }
    .survey-progress-bar__fill { height:100%; background:var(--success); border-radius:var(--radius-full); transition:width .3s ease; }
    .survey-card__actions { display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-4); }
    .status-draft     { background:var(--gray-200); color:var(--gray-700); }
    .status-published { background:rgba(39,174,96,.12); color:#1e8449; }
    .status-closed    { background:rgba(192,57,43,.12); color:var(--danger); }

    /* ── 結果ビュー ── */
    .res-subtabs { display:flex; gap:var(--space-2); margin-bottom:var(--space-6); flex-wrap:wrap; }
    .res-subtab { padding:var(--space-2) var(--space-4); border:1px solid var(--gray-200); border-radius:var(--radius-full);
                  background:var(--white); font-size:var(--text-sm); color:var(--gray-500); cursor:pointer; }
    .res-subtab.active { background:var(--navy-800); color:var(--gold-300); border-color:var(--navy-800); font-weight:600; }
    .res-view { display:none; }
    .res-view.active { display:block; }

    .agg-q { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg); padding:var(--space-5); margin-bottom:var(--space-4); }
    .agg-q__title { font-weight:700; color:var(--navy-800); font-size:var(--text-base); }
    .agg-q__sub { font-size:var(--text-xs); color:var(--gray-400); margin:2px 0 var(--space-4); }
    .agg-bar-row { margin-bottom:var(--space-3); }
    .agg-bar-row__top { display:flex; justify-content:space-between; font-size:var(--text-sm); color:var(--gray-700); margin-bottom:4px; gap:var(--space-3); }
    .agg-bar-row__top .n { font-family:var(--font-numeric); color:var(--gray-500); white-space:nowrap; }
    .agg-bar { height:22px; border-radius:var(--radius-sm); background:var(--gray-100); overflow:hidden; }
    .agg-bar__fill { height:100%; background:var(--navy-600); border-radius:var(--radius-sm); min-width:2px; transition:width .3s ease; }
    .agg-text-list { max-height:280px; overflow:auto; }
    .agg-text-item { padding:var(--space-2) var(--space-3); border-bottom:1px solid var(--gray-100); font-size:var(--text-sm); color:var(--gray-700); white-space:pre-wrap; }
    .agg-text-item:last-child { border-bottom:none; }

    .ind-nav { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); margin-bottom:var(--space-4); }
    .ind-counter { font-size:var(--text-sm); color:var(--gray-500); font-family:var(--font-numeric); }
    .ind-card { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg); padding:var(--space-5); }
    .ind-qa { padding:var(--space-3) 0; border-bottom:1px solid var(--gray-100); }
    .ind-qa:last-child { border-bottom:none; }
    .ind-qa__q { font-size:var(--text-xs); color:var(--gray-500); margin-bottom:2px; }
    .ind-qa__a { font-size:var(--text-sm); color:var(--navy-800); white-space:pre-wrap; }
    .ind-qa__a.empty { color:var(--gray-300); }

    .resp-list { max-height:360px; overflow-y:auto; }
    .resp-row { display:flex; align-items:center; justify-content:space-between; padding:var(--space-2) var(--space-3); border-bottom:1px solid var(--gray-100); font-size:var(--text-sm); }
    .resp-row:last-child { border-bottom:none; }

    @media(max-width:640px){
      .sa-tab { padding:var(--space-2) var(--space-3); font-size:var(--text-xs); }
      .qb__row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <div class="page-header fade-in">
      <div>
        <p class="page-header__eyebrow">SURVEYS · ADMIN</p>
        <h1 class="page-header__title">アンケート管理</h1>
      </div>
    </div>

    <!-- 権限なし -->
    <div id="no-permission" style="display:none;padding:var(--space-16);text-align:center;">
      <p style="font-size:var(--text-lg);font-weight:700;color:var(--danger);">このページにはアクセス権限がありません。</p>
      <a href="../index.html" class="btn btn-outline" style="margin-top:var(--space-6);">ダッシュボードに戻る</a>
    </div>

    <div id="sa-app" style="display:none;">

      <div class="sa-tabs fade-in fade-in-1">
        <button class="sa-tab active" data-tab="create">作成・編集</button>
        <button class="sa-tab" data-tab="manage">アンケート一覧</button>
      </div>

      <!-- ── 作成・編集タブ ── -->
      <div class="sa-panel active" id="panel-create">
        <div class="card mb-6">
          <div class="card__header">
            <span class="card__title" id="builder-heading">新しいアンケートを作成</span>
          </div>
          <div class="card__body">

            <div class="form-group">
              <label class="form-label">タイトル <span class="required">*</span></label>
              <input type="text" id="c-title" class="form-control" placeholder="例：定期演奏会の選曲アンケート">
            </div>
            <div class="form-group">
              <label class="form-label">説明（任意・回答画面とダッシュボードに表示されます）</label>
              <textarea id="c-description" class="form-control" rows="2" placeholder="例：11月の定演で演奏したい曲を教えてください"></textarea>
            </div>

            <!-- 質問ビルダー -->
            <label class="form-label" style="margin-top:var(--space-4);">質問</label>
            <div id="builder-questions"></div>
            <button class="btn btn-outline" id="btn-add-question" style="width:100%;border-style:dashed;">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              質問を追加
            </button>

            <!-- 設定 -->
            <div style="border-top:1px solid var(--gray-200);margin-top:var(--space-6);padding-top:var(--space-5);">
              <div class="form-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);">
                <div class="form-group">
                  <label class="form-label">回答開始日（任意）</label>
                  <input type="date" id="c-start-date" class="form-control">
                </div>
                <div class="form-group">
                  <label class="form-label">回答終了日（任意）</label>
                  <input type="date" id="c-end-date" class="form-control">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">対象区分（未選択の場合は全員が対象になります）</label>
                <div class="cat-check-group" id="c-target-categories">
                  <label class="cat-check-item"><input type="checkbox" value="regular"> 正団員</label>
                  <label class="cat-check-item"><input type="checkbox" value="regular_student"> 正団員（学生）</label>
                  <label class="cat-check-item"><input type="checkbox" value="trainee"> 準団員</label>
                  <label class="cat-check-item"><input type="checkbox" value="staff"> スタッフ</label>
                  <label class="cat-check-item"><input type="checkbox" value="support"> 賛助</label>
                  <label class="cat-check-item"><input type="checkbox" value="rest"> 休団中</label>
                </div>
              </div>
              <label class="qb-switch" style="margin-top:var(--space-2);">
                <input type="checkbox" id="c-allow-edit" checked>
                回答期間内は、団員が自分の回答を修正できるようにする
              </label>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-6);">
              <button class="btn btn-outline" id="btn-cancel-edit" style="display:none;">編集をやめる</button>
              <button class="btn btn-gold" id="btn-save-survey">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
                <span id="btn-save-label">作成する（下書き）</span>
              </button>
            </div>
          </div>
        </div>
        <div class="alert alert-info">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>
          <span>作成すると下書きとして保存されます。「アンケート一覧」タブで内容を確認し、「公開する」を押すと団員のダッシュボードに表示され、回答できるようになります。</span>
        </div>
      </div>

      <!-- ── 一覧タブ ── -->
      <div class="sa-panel" id="panel-manage">
        <!-- 一覧 -->
        <div id="survey-list-wrap">
          <div id="survey-list">
            <div style="text-align:center;padding:var(--space-10);"><div class="loading-spinner" style="margin:0 auto;"></div></div>
          </div>
        </div>

        <!-- 結果ビュー -->
        <div id="results-wrap" style="display:none;">
          <button class="btn btn-outline btn-sm" id="btn-results-back" style="margin-bottom:var(--space-5);">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
            一覧に戻る
          </button>

          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-5);">
            <div>
              <h2 id="results-title" style="font-size:var(--text-xl);font-weight:700;color:var(--navy-800);"></h2>
              <p id="results-summary" style="font-size:var(--text-sm);color:var(--gray-500);margin-top:4px;"></p>
            </div>
            <button class="btn btn-outline btn-sm" id="btn-export-csv">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
              CSVでダウンロード
            </button>
          </div>

          <div class="res-subtabs">
            <button class="res-subtab active" data-view="agg">集計</button>
            <button class="res-subtab" data-view="individual">個別の回答</button>
            <button class="res-subtab" data-view="status">回答状況</button>
          </div>

          <div class="res-view active" id="res-agg"></div>
          <div class="res-view" id="res-individual"></div>
          <div class="res-view" id="res-status"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="../js/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script>
// ══════════════════════════════════════
//  状態
// ══════════════════════════════════════
let allSurveys    = [];
let allMembers    = [];
let responsesMap  = {};        // { surveyId: [ {member_id, answers, responded_at}, ... ] }
let editingSurveyId = null;    // 編集中のアンケートID（null=新規作成）

let builderQuestions = [];     // ビルダー上の質問配列
let qSeq = 0;

// 結果ビュー用
let currentResultSurvey = null;
let currentResponses    = [];
let individualIndex     = 0;

const Q_TYPES = [
  { value:'short_text',   label:'記述式（短文）' },
  { value:'paragraph',    label:'段落（長文）' },
  { value:'radio',        label:'ラジオボタン（単一選択）' },
  { value:'checkbox',     label:'チェックボックス（複数選択）' },
  { value:'dropdown',     label:'プルダウン' },
  { value:'linear_scale', label:'均等目盛' },
  { value:'date',         label:'日付' },
  { value:'time',         label:'時刻' },
  { value:'song_request', label:'曲募集（曲名・出版社・URL）' },
  { value:'section',      label:'テキスト表示（見出し・説明）' },
];
const CHOICE_TYPES = ['radio','checkbox','dropdown'];
const Q_TYPE_LABEL = Object.fromEntries(Q_TYPES.map(t => [t.value, t.label]));

// ══════════════════════════════════════
//  タブ切り替え
// ══════════════════════════════════════
document.querySelectorAll('.sa-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sa-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.sa-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
    if (tab.dataset.tab === 'manage') showListView();
  });
});

// ══════════════════════════════════════
//  データ読み込み
// ══════════════════════════════════════
async function loadMembers() {
  if (!_sb) return;
  const { data } = await _sb.from('profiles').select('id, last_name, first_name, category, email');
  allMembers = data ?? [];
}

async function loadSurveys() {
  if (!_sb) return;
  const { data, error } = await _sb.from('surveys').select('*').order('created_at', { ascending: false });
  if (error) { console.warn('[HighasuiDX] surveys取得失敗:', error.message); return; }
  allSurveys = data ?? [];

  const { data: resp } = await _sb.from('survey_responses').select('survey_id, member_id, answers, responded_at');
  responsesMap = {};
  (resp ?? []).forEach(r => {
    (responsesMap[r.survey_id] ??= []).push(r);
  });
}

function targetMembersFor(survey) {
  const cats = survey.target_categories;
  if (!cats || cats.length === 0) return allMembers;
  return allMembers.filter(m => cats.includes(m.category));
}
function memberName(id) {
  const m = allMembers.find(x => x.id === id);
  return m ? `${m.last_name} ${m.first_name}` : '（不明な団員）';
}

// ══════════════════════════════════════
//  フォームビルダー
// ══════════════════════════════════════
function newQuestion(type = 'short_text') {
  return {
    id: `q_${Date.now().toString(36)}_${(qSeq++).toString(36)}`,
    type, title: '', description: '', required: false,
    options: CHOICE_TYPES.includes(type) ? ['選択肢 1'] : [],
    allow_other: false,
    scale_min: 1, scale_max: 5, scale_min_label: '', scale_max_label: '',
    check_min: null, check_max: null,
    song_multiple: false, song_max: null, publisher_required: false, url_required: false,
  };
}

function renderBuilder() {
  const wrap = document.getElementById('builder-questions');
  if (!builderQuestions.length) {
    wrap.innerHTML = `<p style="color:var(--gray-400);font-size:var(--text-sm);padding:var(--space-4) 0;">「質問を追加」で最初の質問を作成してください。</p>`;
    return;
  }

  wrap.innerHTML = builderQuestions.map((q, i) => {
    const typeOpts = Q_TYPES.map(t => `<option value="${t.value}" ${q.type === t.value ? 'selected' : ''}>${t.label}</option>`).join('');

    let typeBody = '';
    const qNum = builderQuestions.slice(0, i + 1).filter(x => x.type !== 'section').length;
    const itemLabel = q.type === 'section' ? 'テキスト表示' : `質問 ${qNum}`;
    if (CHOICE_TYPES.includes(q.type)) {
      const markSvg = q.type === 'checkbox'
        ? `<svg class="qb-opt__mark" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>`
        : q.type === 'radio'
        ? `<svg class="qb-opt__mark" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/></svg>`
        : `<span class="qb-opt__mark" style="font-family:var(--font-numeric);font-size:12px;color:var(--gray-400);">${'　'}</span>`;

      const opts = q.options.map((o, oi) => `
        <div class="qb-opt">
          ${q.type === 'dropdown' ? `<span class="qb-opt__mark" style="font-size:12px;color:var(--gray-400);font-family:var(--font-numeric);">${oi + 1}.</span>` : markSvg}
          <input type="text" class="form-control" data-qi="${i}" data-opt="${oi}" value="${escHtml(o)}" placeholder="選択肢 ${oi + 1}">
          <span class="qb-opt__del" data-del-opt="${i}:${oi}" title="削除">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </span>
        </div>`).join('');

      const otherRow = q.allow_other ? `
        <div class="qb-opt" style="opacity:.7;">
          ${q.type === 'dropdown' ? '' : markSvg}
          <input type="text" class="form-control" value="その他（自由記述）" disabled style="background:var(--gray-100);">
          <span class="qb-opt__del" data-toggle-other="${i}" title="「その他」を外す">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </span>
        </div>` : '';

      typeBody = `
        <div style="margin-top:var(--space-2);">
          ${opts}${otherRow}
          <div style="display:flex;gap:var(--space-3);margin-top:var(--space-2);">
            <button type="button" class="btn btn-sm btn-outline" data-add-opt="${i}">選択肢を追加</button>
            ${q.type !== 'dropdown' && !q.allow_other ? `<button type="button" class="btn btn-sm btn-outline" data-add-other="${i}">「その他」を追加</button>` : ''}
          </div>
          ${q.type === 'checkbox' ? `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-3);">
            <div>

            </div>

    } else if (q.type === 'song_request') {
      typeBody = `
        <div style="margin-top:var(--space-3);padding:var(--space-4);background:var(--gray-100);border-radius:var(--radius-md);">
          <label class="qb-switch" style="margin-bottom:var(--space-3);">
            <input type="checkbox" data-song="${i}:multiple" ${q.song_multiple ? 'checked' : ''}>

          ${q.song_multiple ? `
          <div style="margin:0 0 var(--space-3) 26px;">
            <label class="form-label" style="font-size:var(--text-xs);">登録できる曲数の上限（任意）</label>
            <input type="number" min="1" class="form-control" data-song="${i}:max" value="${q.song_max ?? ''}" placeholder="指定なし" style="max-width:160px;">
          </div>` : `<p style="font-size:var(--text-xs);color:var(--gray-500);margin:0 0 var(--space-3) 26px;">オフの場合は1曲のみ登録できます。</p>`}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);">
            <div>
              <label class="form-label" style="font-size:var(--text-xs);">出版社の入力</label>
              <select class="form-control" data-song="${i}:pub">
                <option value="optional" ${!q.publisher_required ? 'selected' : ''}>任意</option>
                <option value="required" ${q.publisher_required ? 'selected' : ''}>必須</option>
              </select>
            </div>
            <div>
              <label class="form-label" style="font-size:var(--text-xs);">URLの入力</label>
              <select class="form-control" data-song="${i}:url">
                <option value="optional" ${!q.url_required ? 'selected' : ''}>任意</option>
                <option value="required" ${q.url_required ? 'selected' : ''}>必須</option>
              </select>
            </div>
          </div>
          <p style="font-size:var(--text-xs);color:var(--gray-400);margin-top:var(--space-3);">曲名は常に必須です。集計では曲名ごとに登録数（＝得票数）が自動集計されます。</p>
        </div>`;
    } else if (q.type === 'linear_scale') {
      const numOpts = (from, to, sel) => { let s=''; for (let n=from;n<=to;n++) s += `<option value="${n}" ${sel===n?'selected':''}>${n}</option>`; return s; };
      typeBody = `
        <div class="qb-scale-row" style="margin-top:var(--space-2);">
          <select class="form-control" data-scale="${i}:min" style="width:80px;">${numOpts(0,1,q.scale_min)}</select>
          <span style="color:var(--gray-400);">〜</span>
          <select class="form-control" data-scale="${i}:max" style="width:80px;">${numOpts(2,10,q.scale_max)}</select>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-3);">
          <input type="text" class="form-control" data-scale="${i}:minlabel" value="${escHtml(q.scale_min_label)}" placeholder="最小値のラベル（任意）">
          <input type="text" class="form-control" data-scale="${i}:maxlabel" value="${escHtml(q.scale_max_label)}" placeholder="最大値のラベル（任意）">
        </div>`;
    }

    return `
      <div class="qb" data-qcard="${i}">

          <div class="qb__tools">

              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/></svg>

            <button class="qb__tool" data-move="${i}:1" ${i === builderQuestions.length - 1 ? 'disabled' : ''} title="下へ">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
            </button>
            <button class="qb__tool" data-dup="${i}" title="複製">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m0 0H5.625"/></svg>
            </button>
            <button class="qb__tool danger" data-del="${i}" title="削除">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
            </button>
          </div>
        </div>

        <div class="qb__row">
          <input type="text" class="form-control" data-qi="${i}" data-field="title" value="${escHtml(q.title)}" placeholder="${q.type === 'section' ? '見出しテキスト' : '質問文を入力'}">
          <select class="form-control" data-qi="${i}" data-field="type">${typeOpts}</select>
        </div>
        <input type="text" class="form-control" data-qi="${i}" data-field="description" value="${escHtml(q.description)}" placeholder="${q.type === 'section' ? '表示する説明文（任意）' : '補足説明（任意）'}" style="margin-bottom:var(--space-2);font-size:var(--text-sm);">

        ${typeBody}

        <div class="qb-foot">
          ${q.type === 'section' ? '' : `
          <label class="qb-switch">
            <input type="checkbox" data-qi="${i}" data-field="required" ${q.required ? 'checked' : ''}>
            必須
          </label>`}
          <span style="font-size:var(--text-xs);color:var(--gray-400);">形式：${Q_TYPE_LABEL[q.type]}</span>
        </div>
      </div>`;
  }).join('');
}

// ビルダーのイベント（委譲）
document.getElementById('builder-questions').addEventListener('input', e => {
  const t = e.target;
  const i = Number(t.dataset.qi);
  if (t.dataset.field === 'title')       builderQuestions[i].title = t.value;
  else if (t.dataset.field === 'description') builderQuestions[i].description = t.value;
  else if (t.dataset.opt !== undefined)  builderQuestions[i].options[Number(t.dataset.opt)] = t.value;
  else if (t.dataset.scale) {
    const [qi, key] = t.dataset.scale.split(':'); const q = builderQuestions[Number(qi)];
    if (key === 'minlabel') q.scale_min_label = t.value;
    else if (key === 'maxlabel') q.scale_max_label = t.value;
  }
  else if (t.dataset.limit) {
    const [qi, key] = t.dataset.limit.split(':'); const q = builderQuestions[Number(qi)];
    const v = t.value === '' ? null : Math.max(0, parseInt(t.value, 10) || 0);
    if (key === 'min') q.check_min = v; else q.check_max = v;
  }
  else if (t.dataset.song) {
    const [qi, key] = t.dataset.song.split(':'); const q = builderQuestions[Number(qi)];
    if (key === 'max') q.song_max = t.value === '' ? null : Math.max(1, parseInt(t.value, 10) || 1);
  }
});

document.getElementById('builder-questions').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.song) {
    const [qi, key] = t.dataset.song.split(':'); const q = builderQuestions[Number(qi)];
    if (key === 'multiple') { q.song_multiple = t.checked; renderBuilder(); }
    else if (key === 'pub') q.publisher_required = (t.value === 'required');
    else if (key === 'url') q.url_required = (t.value === 'required');
    return;
  }
  const i = Number(t.dataset.qi);
  if (t.dataset.field === 'required') { builderQuestions[i].required = t.checked; return; }
  if (t.dataset.field === 'type') {
    const q = builderQuestions[i]; const prev = q.type; q.type = t.value;
    if (CHOICE_TYPES.includes(q.type) && (!q.options || q.options.length === 0)) q.options = ['選択肢 1'];
    if (!CHOICE_TYPES.includes(q.type) || q.type === 'dropdown') q.allow_other = false;
    renderBuilder(); return;
  }
  if (t.dataset.scale) {
    const [qi, key] = t.dataset.scale.split(':'); const q = builderQuestions[Number(qi)];
    if (key === 'min') q.scale_min = Number(t.value);
    else if (key === 'max') q.scale_max = Number(t.value);
    renderBuilder();
  }
});

document.getElementById('builder-questions').addEventListener('click', e => {
  const btn = e.target.closest('[data-move],[data-dup],[data-del],[data-add-opt],[data-del-opt],[data-add-other],[data-toggle-other]');
  if (!btn) return;

  if (btn.dataset.move !== undefined) {
    const [i, dir] = btn.dataset.move.split(':').map(Number);
    const j = i + dir;
    if (j < 0 || j >= builderQuestions.length) return;
    [builderQuestions[i], builderQuestions[j]] = [builderQuestions[j], builderQuestions[i]];
    renderBuilder();
  } else if (btn.dataset.dup !== undefined) {
    const i = Number(btn.dataset.dup);
    const copy = JSON.parse(JSON.stringify(builderQuestions[i]));
    copy.id = `q_${Date.now().toString(36)}_${(qSeq++).toString(36)}`;
    builderQuestions.splice(i + 1, 0, copy);
    renderBuilder();
  } else if (btn.dataset.del !== undefined) {
    builderQuestions.splice(Number(btn.dataset.del), 1);
    renderBuilder();
  } else if (btn.dataset.addOpt !== undefined) {
    const q = builderQuestions[Number(btn.dataset.addOpt)];
    q.options.push(`選択肢 ${q.options.length + 1}`);
    renderBuilder();
  } else if (btn.dataset.delOpt !== undefined) {
    const [i, oi] = btn.dataset.delOpt.split(':').map(Number);
    builderQuestions[i].options.splice(oi, 1);
    if (builderQuestions[i].options.length === 0) builderQuestions[i].options.push('選択肢 1');
    renderBuilder();
  } else if (btn.dataset.addOther !== undefined) {
    builderQuestions[Number(btn.dataset.addOther)].allow_other = true;
    renderBuilder();
  } else if (btn.dataset.toggleOther !== undefined) {
    builderQuestions[Number(btn.dataset.toggleOther)].allow_other = false;
    renderBuilder();
  }
});

document.getElementById('btn-add-question').addEventListener('click', () => {
  builderQuestions.push(newQuestion());
  renderBuilder();
  document.getElementById('builder-questions').lastElementChild?.scrollIntoView({ behavior:'smooth', block:'center' });
});

//  保存（新規作成 / 更新）
// ══════════════════════════════════════
function resetBuilder() {
  editingSurveyId = null;
  builderQuestions = [];
  ['c-title','c-description','c-start-date','c-end-date'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('#c-target-categories input').forEach(el => el.checked = false);
  document.getElementById('c-allow-edit').checked = true;
  document.getElementById('builder-heading').textContent = '新しいアンケートを作成';
  document.getElementById('btn-save-label').textContent = '作成する（下書き）';
  document.getElementById('btn-cancel-edit').style.display = 'none';
  renderBuilder();
}

document.getElementById('btn-cancel-edit').addEventListener('click', () => {
  resetBuilder();
  document.querySelector('.sa-tab[data-tab="manage"]').click();
});

document.getElementById('btn-save-survey').addEventListener('click', async () => {
  const title       = document.getElementById('c-title').value.trim();
  const description = document.getElementById('c-description').value.trim();
  const startDate   = document.getElementById('c-start-date').value || null;
  const endDate     = document.getElementById('c-end-date').value || null;
  const allowEdit   = document.getElementById('c-allow-edit').checked;
  const cats        = [...document.querySelectorAll('#c-target-categories input:checked')].map(el => el.value);

  if (!title) { showToast('タイトルを入力してください', 'error'); return; }
  if (!builderQuestions.length) { showToast('項目を1つ以上追加してください', 'error'); return; }
  for (const [idx, q] of builderQuestions.entries()) {
    const no = `${idx + 1}番目の項目`;
    if (q.type === 'section') {
      if (!q.title.trim() && !q.description.trim()) { showToast(`${no}（テキスト表示）の文章を入力してください`, 'error'); return; }
      continue;
    }
    if (!q.title.trim()) { showToast(`${no}の質問文を入力してください`, 'error'); return; }
    if (CHOICE_TYPES.includes(q.type)) {
      const valid = q.options.filter(o => o.trim());
      if (valid.length === 0) { showToast(`${no}の選択肢を入力してください`, 'error'); return; }
    }
    if (q.type === 'checkbox' && q.check_min != null && q.check_max != null && q.check_min > q.check_max) {
      showToast(`${no}の選択数は、最小が最大を超えないようにしてください`, 'error'); return;
    }
  }
  if (startDate && endDate && startDate > endDate) { showToast('回答終了日は開始日より後にしてください', 'error'); return; }
  if (!_sb) { showToast('Supabase未接続のため保存できません', 'error'); return; }

  // 保存用に質問を整形
  const questions = builderQuestions.map(q => {
    const base = { id: q.id, type: q.type, title: q.title.trim(), description: q.description.trim(), required: !!q.required };
    if (CHOICE_TYPES.includes(q.type)) {
      base.options = q.options.map(o => o.trim()).filter(Boolean);
      base.allow_other = !!q.allow_other;
    }
    if (q.type === 'checkbox') {
      if (q.check_min != null) base.check_min = q.check_min;
      if (q.check_max != null) base.check_max = q.check_max;
    }
    if (q.type === 'linear_scale') {
      base.scale_min = Number(q.scale_min); base.scale_max = Number(q.scale_max);
      base.scale_min_label = q.scale_min_label.trim(); base.scale_max_label = q.scale_max_label.trim();
    }
    if (q.type === 'song_request') {
      base.song_multiple = !!q.song_multiple;
      if (q.song_multiple && q.song_max != null) base.song_max = q.song_max;
      base.publisher_required = !!q.publisher_required;
      base.url_required = !!q.url_required;
    }
    return base;
  });

  const payload = {
    title, description,
    questions,
    target_categories: cats.length ? cats : null,
    start_date: startDate, end_date: endDate,
    allow_response_edit: allowEdit,
  };

  const btn = document.getElementById('btn-save-survey');
  btn.disabled = true; const label = btn.innerHTML; btn.textContent = '保存中…';

  let error;
  if (editingSurveyId) {
    ({ error } = await _sb.from('surveys').update(payload).eq('id', editingSurveyId));
  } else {
    payload.status = 'draft';
    payload.created_by = getSessionUser()?.id ?? null;
    ({ error } = await _sb.from('surveys').insert(payload));
  }

  btn.disabled = false; btn.innerHTML = label;
  if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }

  showToast(editingSurveyId ? '変更を保存しました' : '下書きを作成しました', 'success');
  resetBuilder();
  await loadSurveys();
  document.querySelector('.sa-tab[data-tab="manage"]').click();
});

function showListView() {
  document.getElementById('survey-list-wrap').style.display = 'block';
  document.getElementById('results-wrap').style.display = 'none';
  renderSurveyList();
}

function renderSurveyList() {
  const el = document.getElementById('survey-list');
  if (!allSurveys.length) {
    el.innerHTML = `<div style="text-align:center;padding:var(--space-16);color:var(--gray-400);">まだアンケートがありません。「作成・編集」タブから作成してください。</div>`;
    return;
  }

  const STATUS_LABEL = { draft:'下書き', published:'公開中', closed:'締切' };

  el.innerHTML = allSurveys.map(s => {
    const targets   = targetMembersFor(s);
    const responded = responsesMap[s.id]?.length ?? 0;
    const total     = targets.length;
    const pct       = total > 0 ? Math.round((responded / total) * 100) : 0;
    const items     = Array.isArray(s.questions) ? s.questions : [];
    const qCount    = items.filter(q => q.type !== 'section').length;
    const isLegacy  = items.length === 0 && s.form_view_url;

    const actions = [];
    if (s.status === 'draft') {
      actions.push(`<button class="btn btn-sm btn-gold" data-act="publish" data-id="${s.id}">公開する</button>`);
      actions.push(`<button class="btn btn-sm btn-outline" data-act="edit" data-id="${s.id}">編集</button>`);
      actions.push(`<button class="btn btn-sm btn-outline" style="color:var(--danger);border-color:var(--danger);" data-act="delete" data-id="${s.id}">削除</button>`);
    } else if (s.status === 'published') {
      actions.push(`<button class="btn btn-sm btn-outline" data-act="results" data-id="${s.id}">結果を見る</button>`);
      actions.push(`<button class="btn btn-sm btn-outline" data-act="edit" data-id="${s.id}">編集</button>`);
      actions.push(`<button class="btn btn-sm btn-outline" style="color:var(--danger);border-color:var(--danger);" data-act="close" data-id="${s.id}">締め切る</button>`);
    } else {
      actions.push(`<button class="btn btn-sm btn-outline" data-act="results" data-id="${s.id}">結果を見る</button>`);
      actions.push(`<button class="btn btn-sm btn-outline" data-act="publish" data-id="${s.id}">再公開する</button>`);
      actions.push(`<button class="btn btn-sm btn-outline" style="color:var(--danger);border-color:var(--danger);" data-act="delete" data-id="${s.id}">削除</button>`);
    }

    const catLabel = (s.target_categories && s.target_categories.length)
      ? s.target_categories.map(c => CAT_LABELS[c] ?? c).join('、') : '全員';
    const fmtD = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('ja-JP', { month:'numeric', day:'numeric' }) : null;
    const periodLabel = (s.start_date || s.end_date) ? `${fmtD(s.start_date) ?? '—'} 〜 ${fmtD(s.end_date) ?? '期限なし'}` : null;

    return `
      <div class="survey-card">
        <div>
          <span class="badge status-${s.status}" style="font-size:10px;margin-bottom:6px;display:inline-block;">${STATUS_LABEL[s.status]}</span>
          ${isLegacy ? `<span class="badge badge-warning" style="font-size:10px;margin-left:6px;">旧Googleフォーム版</span>` : ''}
          <p class="survey-card__title">${escHtml(s.title)}</p>
          ${s.description ? `<p class="survey-card__desc">${escHtml(s.description)}</p>` : ''}
          <p class="survey-card__meta">
            質問 ${qCount} 問　／　対象：${escHtml(catLabel)}${periodLabel ? `　／　回答期間：${escHtml(periodLabel)}` : ''}
          </p>
        </div>
        <div class="survey-card__progress-wrap">
          <div style="display:flex;justify-content:space-between;font-size:var(--text-xs);color:var(--gray-500);margin-bottom:4px;">
            <span>回答状況</span><span>${responded} / ${total}名（${pct}%）</span>
          </div>
          <div class="survey-progress-bar"><div class="survey-progress-bar__fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="survey-card__actions">${actions.join('')}</div>
      </div>`;
  }).join('');
}

// 一覧アクション（委譲）
document.getElementById('survey-list').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  switch (btn.dataset.act) {
    case 'publish': publishSurvey(id); break;
    case 'close':   closeSurvey(id); break;
    case 'delete':  deleteSurvey(id); break;
    case 'edit':    startEdit(id); break;
    case 'results': openResults(id); break;
  }
});

// ══════════════════════════════════════
//  公開・締切・削除・編集開始
// ══════════════════════════════════════
async function publishSurvey(id) {
  if (!_sb) return;
  const { error } = await _sb.from('surveys').update({ status:'published', published_at:new Date().toISOString() }).eq('id', id);
  if (error) { showToast('公開に失敗しました: ' + error.message, 'error'); return; }
  showToast('アンケートを公開しました。団員のダッシュボードに表示されます。', 'success');
  await loadSurveys(); renderSurveyList();
}
async function closeSurvey(id) {
  if (!_sb) return;
  if (!confirm('このアンケートを締め切りますか？ダッシュボードから表示されなくなります（回答結果は残ります）。')) return;
  const { error } = await _sb.from('surveys').update({ status:'closed', closed_at:new Date().toISOString() }).eq('id', id);
  if (error) { showToast('締切に失敗しました: ' + error.message, 'error'); return; }
  showToast('アンケートを締め切りました', 'success');
  await loadSurveys(); renderSurveyList();
}
async function deleteSurvey(id) {
  if (!_sb) return;
  const s = allSurveys.find(x => x.id === id);
  if (!confirm(`「${s?.title}」を削除しますか？回答結果もすべて削除されます。`)) return;
  const { error } = await _sb.from('surveys').delete().eq('id', id);
  if (error) { showToast('削除に失敗しました: ' + error.message, 'error'); return; }
  showToast('削除しました', 'success');
  await loadSurveys(); renderSurveyList();
}

function startEdit(id) {
  const s = allSurveys.find(x => x.id === id);
  if (!s) return;
  const qCount = Array.isArray(s.questions) ? s.questions.length : 0;
  if (qCount === 0 && s.form_view_url) {
    showToast('このアンケートは旧Googleフォーム版のため、新方式での編集はできません。新規に作り直してください。', 'error');
    return;
  }
  if (s.status === 'published' && (responsesMap[s.id]?.length ?? 0) > 0) {
    if (!confirm('このアンケートには既に回答があります。質問を大きく変更すると、集計結果の見え方が変わることがあります。編集を続けますか？')) return;
  }

  editingSurveyId = id;
  document.getElementById('c-title').value = s.title ?? '';
  document.getElementById('c-description').value = s.description ?? '';
  document.getElementById('c-start-date').value = s.start_date ?? '';
  document.getElementById('c-end-date').value = s.end_date ?? '';
  document.getElementById('c-allow-edit').checked = s.allow_response_edit !== false;
  document.querySelectorAll('#c-target-categories input').forEach(el => {
    el.checked = (s.target_categories ?? []).includes(el.value);
  });

  // 質問を復元（欠損フィールドを補完）
  builderQuestions = (s.questions ?? []).map(q => ({
    id: q.id || `q_${Date.now().toString(36)}_${(qSeq++).toString(36)}`,
    type: q.type || 'short_text',
    title: q.title || '', description: q.description || '', required: !!q.required,
    options: Array.isArray(q.options) ? [...q.options] : [],
    allow_other: !!q.allow_other,
    scale_min: q.scale_min ?? 1, scale_max: q.scale_max ?? 5,
    scale_min_label: q.scale_min_label || '', scale_max_label: q.scale_max_label || '',
    check_min: q.check_min ?? null, check_max: q.check_max ?? null,
    song_multiple: !!q.song_multiple, song_max: q.song_max ?? null,
    publisher_required: !!q.publisher_required, url_required: !!q.url_required,
  }));

  document.getElementById('builder-heading').textContent = `アンケートを編集：${s.title}`;
  document.getElementById('btn-save-label').textContent = '変更を保存する';
  document.getElementById('btn-cancel-edit').style.display = 'inline-flex';
  renderBuilder();
  document.querySelector('.sa-tab[data-tab="create"]').click();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ══════════════════════════════════════
//  結果ビュー
// ══════════════════════════════════════
function openResults(id) {
  currentResultSurvey = allSurveys.find(x => x.id === id);
  if (!currentResultSurvey) return;
  currentResponses = responsesMap[id] ?? [];
  individualIndex = 0;

  document.getElementById('survey-list-wrap').style.display = 'none';
  document.getElementById('results-wrap').style.display = 'block';

  const targets = targetMembersFor(currentResultSurvey);
  document.getElementById('results-title').textContent = currentResultSurvey.title;
  document.getElementById('results-summary').textContent =
    `回答 ${currentResponses.length} 件　／　対象 ${targets.length} 名　（回答率 ${targets.length ? Math.round(currentResponses.length / targets.length * 100) : 0}%）`;

  // サブタブを集計に戻す
  document.querySelectorAll('.res-subtab').forEach(b => b.classList.toggle('active', b.dataset.view === 'agg'));
  document.querySelectorAll('.res-view').forEach(v => v.classList.remove('active'));
  document.getElementById('res-agg').classList.add('active');

  renderAggregation();
  renderIndividual();
  renderStatus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('btn-results-back').addEventListener('click', showListView);

document.querySelectorAll('.res-subtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.res-subtab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.res-view').forEach(v => v.classList.remove('active'));
    document.getElementById(`res-${btn.dataset.view}`).classList.add('active');
  });
});

// ── 集計 ──
function renderAggregation() {
  const host = document.getElementById('res-agg');
  const questions = currentResultSurvey.questions ?? [];
  if (!currentResponses.length) {
    host.innerHTML = `<div class="state-box">まだ回答がありません。</div>`;
    return;
  }

  host.innerHTML = questions.map(q => {
    // テキスト表示：結果でも見出しとして表示（集計対象外）
    if (q.type === 'section') {
      return `<div class="agg-q" style="border-left:4px solid var(--gold-400);background:var(--gold-100);">
                ${q.title ? `<p class="agg-q__title">${escHtml(q.title)}</p>` : ''}
                ${q.description ? `<p style="font-size:var(--text-sm);color:var(--gray-700);white-space:pre-wrap;margin-top:4px;line-height:1.7;">${escHtml(q.description)}</p>` : ''}
              </div>`;
    }

    // 曲募集：曲名ごとに登録数（＝得票数）を集計
    if (q.type === 'song_request') {
      const songLists = currentResponses.map(r => r.answers?.[q.id]).filter(v => Array.isArray(v) && v.length);
      const tally = {}; let totalSongs = 0;
      songLists.forEach(list => list.forEach(song => {
        const name = String(song?.title ?? '').trim(); if (!name) return;
        totalSongs++;
        if (!tally[name]) tally[name] = { count:0, publisher:song.publisher || '', url:song.url || '' };
        tally[name].count++;
        if (!tally[name].publisher && song.publisher) tally[name].publisher = song.publisher;
        if (!tally[name].url && song.url) tally[name].url = song.url;
      }));
      const entries = Object.entries(tally).sort((a, b) => b[1].count - a[1].count);
      const maxN = Math.max(1, ...entries.map(e => e[1].count));
      const bars = entries.length ? entries.map(([name, info]) => `
        <div class="agg-bar-row">
          <div class="agg-bar-row__top">
            <span>${escHtml(name)}${info.publisher ? ` <span style="color:var(--gray-400);font-size:var(--text-xs);">/ ${escHtml(info.publisher)}</span>` : ''}${info.url ? ` <a href="${escHtml(info.url)}" target="_blank" rel="noopener" style="font-size:var(--text-xs);">🔗</a>` : ''}</span>
            <span class="n">${info.count} 票</span>
          </div>
          <div class="agg-bar"><div class="agg-bar__fill" style="width:${info.count / maxN * 100}%;background:var(--gold-500);"></div></div>
        </div>`).join('') : `<p style="font-size:var(--text-sm);color:var(--gray-400);">回答なし</p>`;
      return `
        <div class="agg-q">
          <p class="agg-q__title">${escHtml(q.title)}</p>
          <p class="agg-q__sub">曲募集　・　回答 ${songLists.length} 人　・　登録 ${totalSongs} 件／${entries.length} 曲</p>
          ${bars}
        </div>`;
    }

    const values = currentResponses.map(r => r.answers?.[q.id]).filter(v => v !== undefined && v !== null && v !== '');

    let body = '';
    if (CHOICE_TYPES.includes(q.type) || q.type === 'linear_scale') {
      // 選択肢ごとの集計（その他・目盛も対応）
      const counts = {};
      let base = [];
      if (q.type === 'linear_scale') {
        for (let n = Number(q.scale_min ?? 1); n <= Number(q.scale_max ?? 5); n++) base.push(String(n));
      } else {
        base = [...(q.options ?? [])];
      }
      base.forEach(o => counts[o] = 0);
      const others = [];
      values.forEach(v => {
        const arr = Array.isArray(v) ? v : [v];
        arr.forEach(x => {
          const key = String(x);
          if (key in counts) counts[key]++;
          else others.push(key);          // 「その他」や目盛外
        });
      });
      const maxN = Math.max(1, ...Object.values(counts), others.length ? 1 : 0);
      const totalResp = currentResponses.length;

      body = Object.entries(counts).map(([label, n]) => `
        <div class="agg-bar-row">
          <div class="agg-bar-row__top"><span>${escHtml(label)}</span><span class="n">${n}件（${totalResp ? Math.round(n/totalResp*100) : 0}%）</span></div>
          <div class="agg-bar"><div class="agg-bar__fill" style="width:${n/maxN*100}%;"></div></div>
        </div>`).join('');

      if (others.length) {
        const oc = {}; others.forEach(o => oc[o] = (oc[o]||0)+1);
        body += `<p style="font-size:var(--text-xs);color:var(--gray-500);margin-top:var(--space-3);">その他の回答：</p>`;
        body += `<div class="agg-text-list" style="max-height:160px;">` +
          Object.entries(oc).map(([o,n]) => `<div class="agg-text-item">${escHtml(o)}${n>1?`（${n}件）`:''}</div>`).join('') + `</div>`;
      }
      if (q.type === 'linear_scale') {
        const nums = values.map(Number).filter(n => !isNaN(n));
        const avg = nums.length ? (nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2) : '—';
        body += `<p style="font-size:var(--text-sm);color:var(--navy-700);margin-top:var(--space-3);font-weight:600;">平均：<span style="font-family:var(--font-numeric);">${avg}</span></p>`;
      }
    } else {
      // 自由記述・日付・時刻は一覧表示
      if (!values.length) {
        body = `<p style="font-size:var(--text-sm);color:var(--gray-400);">回答なし</p>`;
      } else {
        body = `<div class="agg-text-list">` +
          values.map(v => `<div class="agg-text-item">${escHtml(Array.isArray(v) ? v.join('、') : v)}</div>`).join('') + `</div>`;
      }
    }

    return `
      <div class="agg-q">
        <p class="agg-q__title">${escHtml(q.title)}</p>
        <p class="agg-q__sub">${Q_TYPE_LABEL[q.type]}　・　回答 ${values.length} 件</p>
        ${body}
      </div>`;
  }).join('');
}

// ── 個別の回答 ──
function renderIndividual() {
  const host = document.getElementById('res-individual');
  if (!currentResponses.length) {
    host.innerHTML = `<div class="state-box">まだ回答がありません。</div>`;
    return;
  }
  const questions = currentResultSurvey.questions ?? [];
  // 回答日時でソート（新しい順）
  const sorted = [...currentResponses].sort((a,b) => new Date(b.responded_at) - new Date(a.responded_at));
  if (individualIndex >= sorted.length) individualIndex = 0;
  const r = sorted[individualIndex];

  const fmtDT = d => d ? new Date(d).toLocaleString('ja-JP', { year:'numeric', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';

  const qa = questions.map(q => {
    if (q.type === 'section') {
      return `<div class="ind-qa">
                ${q.title ? `<p style="font-weight:700;color:var(--navy-700);">${escHtml(q.title)}</p>` : ''}
                ${q.description ? `<p style="font-size:var(--text-xs);color:var(--gray-500);white-space:pre-wrap;">${escHtml(q.description)}</p>` : ''}
              </div>`;
    }
    if (q.type === 'song_request') {
      const list = Array.isArray(r.answers?.[q.id]) ? r.answers[q.id] : [];
      const disp = list.map(s => `${escHtml(s.title || '')}${s.publisher ? `（${escHtml(s.publisher)}）` : ''}${s.url ? `　${escHtml(s.url)}` : ''}`).join('<br>');
      return `
        <div class="ind-qa">
          <p class="ind-qa__q">${escHtml(q.title)}</p>
          <p class="ind-qa__a ${list.length ? '' : 'empty'}">${list.length ? disp : '（未回答）'}</p>
        </div>`;
    }
    const v = r.answers?.[q.id];
    const empty = v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
    const disp = empty ? '（未回答）' : (Array.isArray(v) ? v.join('、') : v);
    return `
      <div class="ind-qa">
        <p class="ind-qa__q">${escHtml(q.title)}</p>
        <p class="ind-qa__a ${empty ? 'empty' : ''}">${escHtml(disp)}</p>
      </div>`;
  }).join('');

  host.innerHTML = `
    <div class="ind-nav">
      <button class="btn btn-sm btn-outline" id="ind-prev" ${individualIndex===0?'disabled':''}>← 前の回答</button>
      <span class="ind-counter">${individualIndex+1} / ${sorted.length}</span>
      <button class="btn btn-sm btn-outline" id="ind-next" ${individualIndex===sorted.length-1?'disabled':''}>次の回答 →</button>
    </div>
    <div class="ind-card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--space-2);padding-bottom:var(--space-3);border-bottom:2px solid var(--gray-100);margin-bottom:var(--space-2);">
        <span style="font-weight:700;color:var(--navy-800);">${escHtml(memberName(r.member_id))}</span>
        <span style="font-size:var(--text-xs);color:var(--gray-400);">回答日時：${fmtDT(r.responded_at)}</span>
      </div>
      ${qa}
    </div>`;

  document.getElementById('ind-prev')?.addEventListener('click', () => { if (individualIndex>0){individualIndex--; renderIndividual();} });
  document.getElementById('ind-next')?.addEventListener('click', () => { if (individualIndex<sorted.length-1){individualIndex++; renderIndividual();} });
}

// ── 回答状況（回答済み／未回答＋督促メール） ──
let statusView = 'answered';
function renderStatus() {
  const host = document.getElementById('res-status');
  const targets = targetMembersFor(currentResultSurvey);
  const respondedIds = new Set(currentResponses.map(r => r.member_id));

  host.innerHTML = `
    <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-4);">
      <button class="btn btn-sm btn-outline status-view-tab active" data-view="answered">回答済み（${targets.filter(m=>respondedIds.has(m.id)).length}）</button>
      <button class="btn btn-sm btn-outline status-view-tab" data-view="unanswered">未回答（${targets.filter(m=>!respondedIds.has(m.id)).length}）</button>
    </div>
    <div class="resp-list" id="status-resp-list"></div>
    <div id="status-reminder-area" style="display:none;margin-top:var(--space-4);border-top:1px solid var(--gray-200);padding-top:var(--space-4);">
      <div class="form-group">
        <label class="form-label">件名</label>
        <input type="text" id="reminder-subject" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">本文</label>
        <textarea id="reminder-body" class="form-control" rows="6" style="resize:vertical;"></textarea>
      </div>
      <button class="btn btn-gold" id="btn-send-reminder">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
        未回答者にメールで督促する
      </button>
    </div>`;

  statusView = 'answered';
  host.querySelectorAll('.status-view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      host.querySelectorAll('.status-view-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      statusView = btn.dataset.view;
      renderStatusList();
    });
  });
  renderStatusList();
  host.querySelector('#btn-send-reminder').addEventListener('click', sendReminder);
}

function renderStatusList() {
  const targets = targetMembersFor(currentResultSurvey);
  const respondedIds = new Set(currentResponses.map(r => r.member_id));
  const list = statusView === 'answered'
    ? targets.filter(m => respondedIds.has(m.id))
    : targets.filter(m => !respondedIds.has(m.id));

  const listEl = document.getElementById('status-resp-list');
  listEl.innerHTML = list.length ? list.map(m => `
    <div class="resp-row">
      <span>${escHtml(m.last_name)} ${escHtml(m.first_name)}</span>
      <span style="color:var(--gray-400);font-size:var(--text-xs);">${escHtml(CAT_LABELS[m.category] ?? '—')}</span>
    </div>`).join('')
    : `<p style="text-align:center;padding:var(--space-6);color:var(--gray-400);font-size:var(--text-sm);">該当する団員がいません。</p>`;

  const reminderArea = document.getElementById('status-reminder-area');
  if (statusView === 'unanswered' && list.length > 0) {
    reminderArea.style.display = 'block';
    document.getElementById('reminder-subject').value = `【東大阪吹奏楽団】アンケートご回答のお願い（${currentResultSurvey.title}）`;
    document.getElementById('reminder-body').value =
`団員の皆様

以下のアンケートへのご回答をまだ確認できておりません。
お手数ですがダッシュボードよりご回答をお願いいたします。

■ アンケート名：${currentResultSurvey.title}
${currentResultSurvey.description ? `■ 内容：${currentResultSurvey.description}\n` : ''}──
東大阪吹奏楽団`;
  } else {
    reminderArea.style.display = 'none';
  }
}

function sendReminder() {
  const targets = targetMembersFor(currentResultSurvey);
  const respondedIds = new Set(currentResponses.map(r => r.member_id));
  const unanswered = targets.filter(m => !respondedIds.has(m.id) && m.email);
  if (!unanswered.length) { showToast('メールアドレスのある未回答者がいません', 'error'); return; }

  const subject = document.getElementById('reminder-subject').value;
  const body    = document.getElementById('reminder-body').value;
  const bcc     = unanswered.map(m => m.email).join(',');
  const mailtoHref = `mailto:?bcc=${encodeURIComponent(bcc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  if (typeof showMailPicker === 'function') showMailPicker(mailtoHref);
  else window.location.href = mailtoHref;
}

// ── CSV出力 ──
document.getElementById('btn-export-csv').addEventListener('click', () => {
  if (!currentResultSurvey) return;
  if (!currentResponses.length) { showToast('出力できる回答がありません', 'error'); return; }
  const questions = currentResultSurvey.questions ?? [];

  const esc = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csvQs = questions.filter(q => q.type !== 'section');
  const header = ['回答者氏名', '区分', '回答日時', ...csvQs.map(q => q.title)];
  const sorted = [...currentResponses].sort((a,b) => new Date(a.responded_at) - new Date(b.responded_at));
  const rows = sorted.map(r => {
    const m = allMembers.find(x => x.id === r.member_id);
    const cols = [
      m ? `${m.last_name} ${m.first_name}` : '（不明）',
      m ? (CAT_LABELS[m.category] ?? m.category ?? '') : '',
      r.responded_at ? new Date(r.responded_at).toLocaleString('ja-JP') : '',
      ...csvQs.map(q => {
        const v = r.answers?.[q.id];
        if (q.type === 'song_request') {
          return Array.isArray(v) ? v.map(s => `${s.title || ''}${s.publisher ? `(${s.publisher})` : ''}${s.url ? ` ${s.url}` : ''}`).join(' / ') : '';
        }
        return Array.isArray(v) ? v.join(' / ') : (v ?? '');
      }),
    ];
    return cols.map(esc).join(',');
  });

  const csv = '﻿' + [header.map(esc).join(','), ...rows].join('\r\n');  // BOM付き（Excel用）
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeTitle = currentResultSurvey.title.replace(/[\\/:*?"<>|]/g, '_');
  a.href = url; a.download = `アンケート回答_${safeTitle}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('CSVをダウンロードしました', 'success');
});

  if (!canDo('surveys_admin')) {
    document.getElementById('no-permission').style.display = 'block';
    return;
  }
  document.getElementById('sa-app').style.display = 'block';
  renderBuilder();

  await Promise.all([loadMembers(), loadSurveys()]);
  renderSurveyList();
});
