<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>要望・不具合管理 — 東大阪吹奏楽団</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .req-tabs { display:flex;gap:0;border-bottom:2px solid var(--gray-200);margin-bottom:var(--space-5);flex-wrap:wrap; }
    .req-tab {
      padding:var(--space-3) var(--space-5);font-size:var(--text-sm);font-weight:500;
      color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
      transition:all var(--transition-fast);background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap;
    }
    .req-tab:hover { color:var(--navy-700); }
    .req-tab.active { color:var(--navy-800);border-bottom-color:var(--gold-500);font-weight:700; }
    .req-panel { display:none; }
    .req-panel.active { display:block; }

    .kind-filter { display:flex;gap:var(--space-2);margin-bottom:var(--space-5);flex-wrap:wrap; }
    .kind-filter button {
      padding:4px 14px;border-radius:var(--radius-full);border:1px solid var(--gray-200);
      background:var(--white);font-size:var(--text-xs);font-weight:600;color:var(--gray-500);cursor:pointer;transition:all var(--transition-fast);
    }
    .kind-filter button.active { background:var(--navy-800);color:var(--white);border-color:var(--navy-800); }

    .fb-card { background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-4); }
    .fb-card__top { display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap; }
    .fb-card__who { font-size:var(--text-sm);font-weight:700;color:var(--navy-800); }
    .fb-card__meta { font-size:var(--text-xs);color:var(--gray-500);margin-top:2px; }
    .fb-card__body { margin-top:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--gray-100);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--gray-700);line-height:1.7;white-space:pre-wrap; }

    .fb-detail { margin-top:var(--space-3);font-size:var(--text-xs);color:var(--gray-500);line-height:1.8; }
    .fb-detail code { background:var(--gray-100);padding:1px 5px;border-radius:4px;font-family:var(--font-numeric,monospace);word-break:break-all; }
    .fb-errlog { margin-top:var(--space-2);max-height:140px;overflow:auto;background:#1e293b;color:#e2e8f0;border-radius:var(--radius-md);padding:var(--space-3);font-size:11px;font-family:var(--font-numeric,monospace);white-space:pre-wrap;line-height:1.6; }

    .fb-triage { margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px dashed var(--gray-200);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3); }
    .fb-triage .form-group { margin-bottom:0; }
    .fb-actions { display:flex;gap:var(--space-3);margin-top:var(--space-4);flex-wrap:wrap;align-items:center; }

    .pri-badge { display:inline-flex;align-items:center;padding:1px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:800; }
    .pri-P0 { background:rgba(192,57,43,.14);color:#c0392b; }
    .pri-P1 { background:rgba(230,126,34,.16);color:#ca6f1e; }
    .pri-P2 { background:rgba(26,46,74,.10);color:var(--navy-700); }
    .pri-P3 { background:var(--gray-200);color:var(--gray-500); }

    .empty-state { text-align:center;padding:var(--space-16);color:var(--gray-400); }

    @media(max-width:640px){ .req-tab { padding:var(--space-2) var(--space-3);font-size:var(--text-xs); } }
  </style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <div class="page-header fade-in">
      <div>
        <p class="page-header__eyebrow">ADMIN</p>
        <h1 class="page-header__title">要望・不具合管理</h1>
      </div>
    </div>

    <!-- 権限なし -->
    <div id="no-permission" style="display:none;">
      <div class="card"><div class="card__body" style="text-align:center;padding:var(--space-16);color:var(--gray-500);">
        <p style="font-size:var(--text-lg);font-weight:700;color:var(--navy-800);margin-bottom:var(--space-2);">閲覧権限がありません</p>
        <p style="font-size:var(--text-sm);">このページは幹部・エンジニア委員のみが閲覧できます。</p>
      </div></div>
    </div>

    <div id="admin-section" style="display:none;">
      <div class="req-tabs fade-in">
        <button class="req-tab active" data-tab="open">
          未対応 <span class="sidebar-badge" id="open-count" style="display:none;margin-left:6px;"></span>
        </button>
        <button class="req-tab" data-tab="progress">対応中</button>
        <button class="req-tab" data-tab="closed">完了・見送り</button>
        <button class="req-tab" data-tab="all">すべて</button>
      </div>

      <div class="kind-filter fade-in" id="kind-filter">
        <button class="active" data-kind="">すべての種類</button>
        <button data-kind="bug">✖ 不具合</button>
        <button data-kind="feature">💡 要望</button>
        <button data-kind="question">❓ 質問</button>
      </div>

      <div class="req-panel active" id="panel-open"><div id="list-open"></div></div>
      <div class="req-panel" id="panel-progress"><div id="list-progress"></div></div>
      <div class="req-panel" id="panel-closed"><div id="list-closed"></div></div>
      <div class="req-panel" id="panel-all"><div id="list-all"></div></div>
    </div>

  </main>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="../js/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script>
// ══════════════════════════════════════
//  要望・不具合 管理（幹部 + engineer）
// ══════════════════════════════════════
let allFeedback = [];
let currentTab  = 'open';
let kindFilter  = '';

const KIND_LABEL = { bug:'うまく動かない', feature:'要望', question:'質問' };
const KIND_BADGE = { bug:'badge-danger', feature:'badge-gold', question:'badge-navy' };
const STATUS_LABEL = {
  new:'受付', triaged:'確認済み', planned:'対応予定', doing:'対応中',
  done:'対応完了', declined:'見送り', duplicate:'重複',
};
// 各タブに含めるステータス
const TAB_STATUS = {
  open:     ['new','triaged'],
  progress: ['planned','doing'],
  closed:   ['done','declined','duplicate'],
};

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('ja-JP', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
// サイドバー(NAV_ITEMS)を唯一の正として画面名を引く
let _pageLabelMap = null;
function pageLabelMap() {
  if (_pageLabelMap) return _pageLabelMap;
  const map = {};
  try {
    (typeof NAV_ITEMS !== 'undefined' ? NAV_ITEMS : []).forEach(sec =>
      (sec.items || []).forEach(it => { map[it.id] = it.label; }));
  } catch {}
  map.applications = map.applications || '各種申請';
  map.feedback     = map.feedback     || '不具合・要望';
  map.settings     = map.settings     || '設定';
  _pageLabelMap = map;
  return map;
}
function pageLabel(id) {
  if (!id) return '（画面指定なし）';
  return pageLabelMap()[id] ?? id;
}

async function loadFeedback() {
  if (!_sb) return;
  const { data, error } = await _sb.from('feedback').select('*').order('created_at', { ascending: false });
  if (error) { console.warn('[HighasuiDX] feedback取得失敗:', error.message); showToast('取得に失敗しました: ' + error.message, 'error'); return; }
  allFeedback = data ?? [];
}

// 重複指定用：同種の他の報告を選択肢にする
function duplicateOptions(f) {
  const others = allFeedback.filter(x => x.id !== f.id);
  const opts = ['<option value="">（重複ではない）</option>'];
  others.forEach(x => {
    const short = (x.body || '').replace(/\s+/g, ' ').slice(0, 24);
    const sel = (f.duplicate_of === x.id) ? 'selected' : '';
    opts.push(`<option value="${x.id}" ${sel}>${escHtml(KIND_LABEL[x.kind] ?? x.kind)}: ${escHtml(short)}…</option>`);
  });
  return opts.join('');
}

function selOptions(map, current) {
  return Object.entries(map).map(([v, l]) =>
    `<option value="${v}" ${v === current ? 'selected' : ''}>${escHtml(l)}</option>`).join('');
}

function renderCard(f) {
  const priBadge = f.priority ? `<span class="pri-badge pri-${f.priority}">${f.priority}</span>` : '';
  const dup = f.duplicate_of ? `<span class="badge badge-navy" style="font-size:10px;margin-left:4px;">重複</span>` : '';
  const hasShot = !!f.screenshot_path;
  const envLine = [
    f.app_version ? `版 <code>${escHtml(f.app_version)}</code>` : '',
    (f.is_pwa ? 'ホーム画面アプリ' : 'ブラウザ'),
  ].filter(Boolean).join('　/　');

  return `
    <div class="fb-card" id="card-${f.id}">
      <div class="fb-card__top">
        <div>
          <div class="fb-card__who">
            <span class="badge ${KIND_BADGE[f.kind] ?? 'badge-navy'}" style="font-size:10px;">${escHtml(KIND_LABEL[f.kind] ?? f.kind)}</span>
            ${priBadge} ${dup}
            <span style="margin-left:6px;">${escHtml(f.member_name ?? '—')}</span>
          </div>
          <div class="fb-card__meta">${escHtml(pageLabel(f.page))}　/　${fmtDate(f.created_at)}　/　状態：${escHtml(STATUS_LABEL[f.status] ?? f.status)}</div>
        </div>
      </div>

      <div class="fb-card__body">${escHtml(f.body)}</div>

      <div class="fb-detail">
        環境：${envLine || '—'}<br>
        <details style="margin-top:4px;">
          <summary style="cursor:pointer;color:var(--navy-600);">端末情報（User-Agent）</summary>
          <code>${escHtml(f.user_agent ?? '—')}</code>
        </details>
        ${f.console_log ? `<details style="margin-top:4px;"><summary style="cursor:pointer;color:var(--danger);">直近のエラー記録</summary><div class="fb-errlog">${escHtml(f.console_log)}</div></details>` : ''}
        ${hasShot ? `<div style="margin-top:6px;"><button class="btn btn-sm btn-outline" onclick="viewShot('${f.id}')">🖼 スクリーンショットを表示</button></div>` : ''}
      </div>

      <div class="fb-triage">
        <div class="form-group">
          <label class="form-label" style="font-size:11px;">種類</label>
          <select class="form-control" data-field="kind" data-id="${f.id}">${selOptions(KIND_LABEL, f.kind)}</select>
        </div>
        <div class="form-group">
          <label class="form-label" style="font-size:11px;">優先度</label>
          <select class="form-control" data-field="priority" data-id="${f.id}">
            <option value="" ${!f.priority ? 'selected' : ''}>未設定</option>
            ${['P0','P1','P2','P3'].map(p => `<option value="${p}" ${f.priority === p ? 'selected' : ''}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" style="font-size:11px;">ステータス</label>
          <select class="form-control" data-field="status" data-id="${f.id}">${selOptions(STATUS_LABEL, f.status)}</select>
        </div>
        <div class="form-group">
          <label class="form-label" style="font-size:11px;">重複元</label>
          <select class="form-control" data-field="duplicate_of" data-id="${f.id}">${duplicateOptions(f)}</select>
        </div>
      </div>

      <div class="form-group" style="margin-top:var(--space-3);margin-bottom:0;">
        <label class="form-label" style="font-size:11px;">送信者への返信・メモ（送信者にも表示されます）</label>
        <textarea class="form-control" data-field="admin_note" data-id="${f.id}" rows="2" style="resize:vertical;">${escHtml(f.admin_note ?? '')}</textarea>
      </div>

      <div class="fb-actions">
        <button class="btn btn-sm btn-gold" onclick="saveCard('${f.id}')">保存</button>
        <button class="btn btn-sm btn-outline" onclick="deleteCard('${f.id}')">削除</button>
      </div>
    </div>`;
}

function renderCurrent() {
  const statuses = TAB_STATUS[currentTab]; // undefined for 'all'
  let items = allFeedback.filter(f => {
    const okStatus = statuses ? statuses.includes(f.status) : true;
    const okKind   = kindFilter ? f.kind === kindFilter : true;
    return okStatus && okKind;
  });

  const listEl = document.getElementById(`list-${currentTab}`);
  if (!listEl) return;
  listEl.innerHTML = items.length
    ? items.map(renderCard).join('')
    : `<div class="empty-state"><p style="font-size:var(--text-sm);">該当する報告はありません</p></div>`;

  // 未対応バッジ
  const openCount = allFeedback.filter(f => TAB_STATUS.open.includes(f.status)).length;
  const badge = document.getElementById('open-count');
  if (openCount > 0) { badge.textContent = openCount; badge.style.display = 'inline-flex'; }
  else badge.style.display = 'none';
}

async function viewShot(id) {
  const f = allFeedback.find(x => x.id === id);
  if (!f || !f.screenshot_path || !_sb) return;
  const { data, error } = await _sb.storage.from('feedback').createSignedUrl(f.screenshot_path, 120);
  if (error || !data?.signedUrl) { showToast('画像を表示できませんでした: ' + (error?.message ?? ''), 'error'); return; }
  window.open(data.signedUrl, '_blank');
}

async function saveCard(id) {
  if (!_sb) return;
  const get = field => document.querySelector(`[data-field="${field}"][data-id="${id}"]`);
  const status   = get('status').value;
  const patch = {
    kind:         get('kind').value,
    priority:     get('priority').value || null,
    status,
    duplicate_of: get('duplicate_of').value || null,
    admin_note:   get('admin_note').value.trim() || null,
    handled_by:   getSessionUser()?.id ?? null,
    handled_at:   new Date().toISOString(),
  };
  // 重複元が選ばれていれば status を duplicate に寄せる（任意の補助）
  if (patch.duplicate_of && status === 'new') patch.status = 'duplicate';

  const { error } = await _sb.from('feedback').update(patch).eq('id', id);
  if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }
  showToast('保存しました', 'success');
  await loadFeedback();
  renderCurrent();
}

async function deleteCard(id) {
  if (!_sb) return;
  if (!confirm('この報告を削除しますか？（元に戻せません）')) return;
  const { error } = await _sb.from('feedback').delete().eq('id', id);
  if (error) { showToast('削除に失敗しました: ' + error.message, 'error'); return; }
  showToast('削除しました', 'success');
  await loadFeedback();
  renderCurrent();
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!canDo('feedback_admin')) {
    document.getElementById('no-permission').style.display = 'block';
    return;
  }
  document.getElementById('admin-section').style.display = 'block';

  await loadFeedback();
  renderCurrent();

  document.querySelectorAll('.req-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.req-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.req-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      document.getElementById(`panel-${currentTab}`).classList.add('active');
      renderCurrent();
    });
  });

  document.querySelectorAll('#kind-filter button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#kind-filter button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      kindFilter = b.dataset.kind;
      renderCurrent();
    });
  });
});
</script>
</body>
</html>
